<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>WebAR - Zelva</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="config.js"></script>
    <script src="js/catalog-loader.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }
      a-scene {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
      }
      video, canvas, .a-canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
      }
      video { object-fit: cover !important; z-index: 0 !important; }
      canvas, .a-canvas { z-index: 1 !important; background: transparent !important; }

      #loader-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #loader-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-spinner {
        border: 5px solid #f3f3f3;
        border-top: 5px solid #ff9800;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      .loader-text {
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #status-indicator {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 9998;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 0.9rem;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        user-select: none;
        pointer-events: none;
        max-width: 70vw;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #ff9800;
        box-shadow: 0 0 0 4px rgba(255, 152, 0, 0.25);
      }
      #tap-overlay {
        position: fixed;
        inset: 0;
        z-index: 9997;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #fff;
        background: rgba(0, 0, 0, 0.35);
        font-size: 1.1rem;
        font-weight: 700;
      }
      #tap-overlay.visible {
        display: flex;
      }
    </style>
  </head>
  
  <body>
    <div id="loader-overlay">
      <div class="loader-spinner"></div>
      <div class="loader-text">Cargando Experiencia AR...</div>
    </div>

    <div id="status-indicator" data-state="loading">
      <div class="status-dot"></div>
      <div id="status-text">Preparando...</div>
    </div>
    <div id="tap-overlay">
      Toca la pantalla para activar la cámara
    </div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
      embedded
      mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1;"
      background="transparent: true">
      <a-light type="hemisphere" groundColor="#443333" color="#FFFAFA" intensity="1.6"></a-light>
      <a-light type="directional" position="1 4 2" intensity="1.2" color="#FFF"></a-light>
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable" near="0.005" far="500"></a-camera>
    </a-scene>

    <script>
      (() => {
        const statusText = document.getElementById('status-text');
        const loader = document.getElementById('loader-overlay');
        const tapOverlay = document.getElementById('tap-overlay');
        const sceneEl = document.querySelector('a-scene');

        const setStatus = (state, text) => {
          if (statusText) statusText.innerText = String(text || '');
          const el = document.getElementById('status-indicator');
          if (el) el.dataset.state = String(state || '');
        };

        const hideLoader = () => {
          if (!loader) return;
          loader.classList.add('hidden');
        };

        const forceCameraLayers = () => {
          try {
            const videos = document.querySelectorAll('video');
            for (const v of videos) {
              v.style.position = 'fixed';
              v.style.inset = '0';
              v.style.width = '100vw';
              v.style.height = '100vh';
              v.style.objectFit = 'cover';
              v.style.zIndex = '0';
              v.style.display = 'block';
              v.setAttribute('playsinline', '');
              v.setAttribute('webkit-playsinline', '');
              v.muted = true;
              v.autoplay = true;
            }
            const canvases = document.querySelectorAll('canvas');
            for (const c of canvases) {
              c.style.position = 'fixed';
              c.style.inset = '0';
              c.style.width = '100vw';
              c.style.height = '100vh';
              c.style.zIndex = '1';
              c.style.background = 'transparent';
            }
          } catch (e) {}
        };

        const host = String(location.hostname || '').toLowerCase();
        const isLocalHost = host === 'localhost' || host === '127.0.0.1';

        const getSessionId = () => {
          const key = 'webar_session_id';
          try {
            const existing = String(localStorage.getItem(key) || '').trim();
            if (existing) return existing;
          } catch (e) {}
          let id = '';
          try {
            if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
              const bytes = new Uint8Array(16);
              window.crypto.getRandomValues(bytes);
              id = Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
            }
          } catch (e) {}
          if (!id) id = `${Date.now().toString(16)}${Math.random().toString(16).slice(2)}`;
          try {
            localStorage.setItem(key, id);
          } catch (e) {}
          return id;
        };

        const trackUsage = () => {
          const payload = JSON.stringify({
            sessionId: getSessionId(),
            path: `${location.pathname || '/'}${location.search || ''}`
          });
          try {
            if (navigator && typeof navigator.sendBeacon === 'function') {
              const blob = new Blob([payload], { type: 'application/json' });
              navigator.sendBeacon('/api/analytics/track', blob);
              return;
            }
          } catch (e) {}
          try {
            fetch('/api/analytics/track', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: payload,
              keepalive: true
            }).catch(() => {});
          } catch (e) {}
        };

        trackUsage();

        const canUseCamera = () => {
          const secure = !!window.isSecureContext || location.protocol === 'https:' || isLocalHost;
          if (!secure) {
            setStatus('error', 'La cámara requiere HTTPS o localhost');
            hideLoader();
            return false;
          }
          return true;
        };

        const canFetchWithTimeout = async (url, timeoutMs = 1500) => {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            const res = await fetch(url, { method: 'HEAD', cache: 'no-store', signal: controller.signal });
            clearTimeout(timer);
            if (res.status === 405) return true;
            return res.ok;
          } catch (e) {
            return false;
          }
        };

        const resolveTargetsSrc = () => {
          if (typeof CONFIG !== 'undefined' && CONFIG && typeof CONFIG.getApiBaseUrl === 'function') {
            const base = CONFIG.getApiBaseUrl();
            if (base) return `${base}/api/targets.mind`;
          }
          return 'targets.mind';
        };

        let arSystem = null;
        let arStarted = false;
        let catalogReady = false;
        let targetsReady = false;
        let userActivated = true;
        let autoRetryTimer = null;
        let autoRetryDelayMs = 800;

        const preflightCameraPermission = async () => {
          if (!canUseCamera()) return { ok: false, reason: 'insecure' };
          try {
            const md = navigator && navigator.mediaDevices ? navigator.mediaDevices : null;
            if (!md || typeof md.getUserMedia !== 'function') return { ok: false, reason: 'unsupported' };
            const perms = navigator && navigator.permissions ? navigator.permissions : null;
            if (perms && typeof perms.query === 'function') {
              const res = await perms.query({ name: 'camera' });
              const state = String(res && res.state ? res.state : '');
              if (state === 'denied') return { ok: false, reason: 'denied', error: new Error('denied') };
            }
            return { ok: true };
          } catch (err) {
            return { ok: true };
          }
        };

        const setTapVisible = (visible) => {
          if (!tapOverlay) return;
          if (visible) tapOverlay.classList.add('visible');
          else tapOverlay.classList.remove('visible');
        };

        const tryStart = async () => {
          if (arStarted) return;
          if (!arSystem) return;
          if (!targetsReady) return;
          if (!canUseCamera()) return;

          arStarted = true;
          setStatus('scanning', 'Solicitando cámara...');
          setTapVisible(false);
          try {
            const pre = await preflightCameraPermission();
            if (!pre?.ok) {
              const r = String(pre?.reason || '');
              if (r === 'unsupported') throw new Error('media_unsupported');
              if (r === 'notfound') throw new Error('camera_not_found');
              if (r === 'denied') throw new Error('permission_denied');
            }
            await arSystem.start();
            hideLoader();
            setStatus('scanning', 'Escaneando...');
            forceCameraLayers();
            if (autoRetryTimer) {
              clearTimeout(autoRetryTimer);
              autoRetryTimer = null;
            }
            autoRetryDelayMs = 800;
          } catch (err) {
            arStarted = false;
            const msg = String(err?.message || err || '').toLowerCase();
            if (msg.includes('permission_denied') || msg.includes('notallowed') || msg.includes('permission') || msg.includes('denied')) {
              setStatus('scanning', 'Toca para activar la cámara');
              setTapVisible(true);
            } else if (msg.includes('media_unsupported')) {
              setStatus('error', 'Tu navegador no soporta cámara en esta página.');
            } else if (msg.includes('camera_not_found') || msg.includes('notfound')) {
              setStatus('error', 'No se detectó cámara. Revisa tu dispositivo.');
            } else if (msg.includes('target') || msg.includes('mind') || msg.includes('compile')) {
              setStatus('error', 'No se pudo cargar targets.mind.');
            } else {
              setStatus('scanning', 'Activando cámara...');
            }
            hideLoader();
            if (!autoRetryTimer) {
              autoRetryTimer = setTimeout(() => {
                autoRetryTimer = null;
                tryStart();
              }, autoRetryDelayMs);
              autoRetryDelayMs = Math.min(5000, Math.floor(autoRetryDelayMs * 1.6));
            }
          }
        };

        AFRAME.registerComponent('marker-handler', {
          init: function () {
            const idParts = String(this.el.id || '').split('-');
            const markerId = idParts.length > 1 ? idParts.slice(1).join('-') : '';

            this.el.addEventListener('targetFound', () => {
              const modelEl = document.getElementById('model-' + markerId);
              if (modelEl && !modelEl.getAttribute('gltf-model')) {
                const src = modelEl.getAttribute('data-gltf-src');
                if (src) modelEl.setAttribute('gltf-model', src);
              }
              setStatus('tracking', 'Detectado');
            });

            this.el.addEventListener('targetLost', () => {
              setStatus('scanning', 'Escaneando...');
            });
          }
        });

        const initTargets = async () => {
          const src = resolveTargetsSrc();
          setStatus('loading', 'Cargando targets...');
          const ok = await canFetchWithTimeout(src, 2200);
          if (!ok) {
            targetsReady = false;
            setStatus('error', 'Falta targets.mind');
            hideLoader();
            return;
          }
          sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${src}; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1;`);
          targetsReady = true;
          tryStart();
        };

        document.addEventListener('catalogloaded', () => {
          catalogReady = true;
          tryStart();
        });

        window.addEventListener('pointerdown', () => {
          if (!userActivated) userActivated = true;
          tryStart();
        }, { passive: true });

        const onSceneLoaded = () => {
          arSystem = sceneEl.systems && sceneEl.systems['mindar-image-system'];
          if (sceneEl.renderer) {
            const dpr = Math.max(1, Math.min(3, Number(window.devicePixelRatio || 1)));
            sceneEl.renderer.setPixelRatio(dpr);
          }
          tryStart();
          setTimeout(() => hideLoader(), 1500);
        };

        if (sceneEl && sceneEl.hasLoaded) onSceneLoaded();
        else if (sceneEl) sceneEl.addEventListener('loaded', onSceneLoaded, { once: true });

        initTargets();
        setTapVisible(false);
        setStatus('loading', 'Preparando...');
        tryStart();
      })();
    </script>
  </body>
</html>
