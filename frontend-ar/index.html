<!DOCTYPE html>
<html>
  <head>
    <title>WebAR - V6 (RAYCASTER)</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- System Configuration -->
    <script src="config.js"></script>
    <!-- Catalog Loader -->
    <script src="js/catalog-loader.js"></script>

    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; touch-action: none; background: #000; }
      a-scene, .a-canvas, video {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
      }
      video { z-index: 0 !important; }
      .a-canvas { z-index: 1 !important; background: transparent !important; }
      video { object-fit: cover !important; }
      
      .capture-button {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 60px;
        background-color: rgba(255, 255, 255, 0.8);
        border: 4px solid white;
        border-radius: 50%;
        z-index: 1000;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      
      .capture-button:active {
        background-color: white;
        transform: translateX(-50%) scale(0.95);
      }

      .capture-icon {
        width: 24px;
        height: 24px;
        background-color: #333;
        border-radius: 50%;
      }

      /* Info Panel Styles */
      .info-panel {
        position: fixed;
        bottom: 110px; /* Above capture button */
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 400px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 15px;
        z-index: 900;
        display: none; /* Hidden by default */
        text-align: center;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: opacity 0.3s ease;
      }
      .info-panel.visible {
        display: block;
      }

      .info-panel h2 {
        margin: 0 0 5px 0;
        font-size: 1.2rem;
        color: #ff9800; /* Orange accent */
      }

      .info-panel p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
        color: #ddd;
      }

      .info-panel .price {
        display: block;
        margin-top: 8px;
        font-weight: bold;
        font-size: 1.1rem;
        color: #4caf50; /* Green for price */
      }

      /* Flash Effect Overlay */
      #flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        opacity: 0;
        z-index: 2000;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
      }
      .flash-active {
        opacity: 0.8 !important;
      }

      /* Loading Screen */
      #loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loader-spinner {
        border: 5px solid #f3f3f3;
        border-top: 5px solid #ff9800;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      .loader-text {
        color: white;
        font-size: 1.2rem;
        font-weight: bold;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #ar-retry {
        position: fixed;
        inset: 0;
        z-index: 9997;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        padding: 22px;
        box-sizing: border-box;
        background: rgba(0,0,0,0.35);
      }
      #ar-retry .retry-card {
        width: min(520px, 92vw);
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 16px;
        padding: 18px 16px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        text-align: center;
      }
      #ar-retry .retry-title {
        font-size: 1.1rem;
        font-weight: 800;
        margin: 0 0 6px 0;
      }
      #ar-retry .retry-sub {
        font-size: 0.92rem;
        opacity: 0.92;
        margin: 0 0 14px 0;
        line-height: 1.35;
      }
      #ar-retry .retry-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border-radius: 999px;
        background: rgba(255, 152, 0, 0.95);
        color: #111;
        font-weight: 800;
        border: none;
        min-width: 220px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* Info Button (i) */
      .info-btn {
        position: fixed;
        bottom: 110px;
        right: 20px;
        width: 50px;
        height: 50px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        border: 2px solid white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
        font-weight: bold;
        z-index: 950;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: auto;
      }
      .info-btn.visible {
        opacity: 1;
      }

      #admin-hotspot {
        position: fixed;
        top: 0;
        right: 0;
        width: 26px;
        height: 26px;
        z-index: 10002;
        opacity: 0;
        pointer-events: auto;
      }

      /* Detailed Info Modal */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 10000;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .modal-content {
        background-color: #fff;
        color: #333;
        width: 100%;
        max-width: 400px;
        border-radius: 15px;
        padding: 25px;
        position: relative;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        animation: slideUp 0.3s ease-out;
      }
      @keyframes slideUp {
        from { transform: translateY(50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .close-modal {
        position: absolute;
        top: 15px;
        right: 15px;
        font-size: 1.5rem;
        cursor: pointer;
        color: #888;
      }
      .modal-title {
        color: #ff9800;
        margin-top: 0;
        font-size: 1.5rem;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
        margin-bottom: 15px;
      }
      .modal-detail-row {
        display: flex;
        margin-bottom: 10px;
        font-size: 0.95rem;
      }
      .modal-label {
        font-weight: bold;
        min-width: 100px;
        color: #555;
      }
      .modal-value {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <!-- Loader -->
    <div id="loader-overlay">
      <div class="loader-spinner"></div>
      <div class="loader-text">Cargando Experiencia AR...</div>
    </div>

    <div id="ar-retry"></div>
    
    <!-- Info Button -->
    <div class="info-btn" id="info-btn">i</div>
    <div id="admin-hotspot"></div>

    <!-- Detailed Modal -->
    <div class="modal-overlay" id="detail-modal">
      <div class="modal-content">
        <span class="close-modal" id="close-modal">&times;</span>
        <h2 class="modal-title" id="modal-title">Nombre del Plato</h2>
        
        <div class="modal-detail-row">
          <div class="modal-label">Ingredientes:</div>
          <div class="modal-value" id="modal-ingredients">Lista de ingredientes...</div>
        </div>
        
        <div class="modal-detail-row">
          <div class="modal-label">Calorías:</div>
          <div class="modal-value" id="modal-calories">000 kcal</div>
        </div>

        <div class="modal-detail-row">
          <div class="modal-label">Tiempo:</div>
          <div class="modal-value" id="modal-time">15 min</div>
        </div>

        <div class="modal-detail-row" style="margin-top: 20px; font-style: italic; color: #666;">
          <div class="modal-value" id="modal-chef-note">"Nota del chef aquí..."</div>
        </div>
      </div>
    </div>

    <!-- Flash Overlay -->
    <div id="flash-overlay"></div>

    <!-- Capture Button -->
    <div class="capture-button" id="capture-btn">
      <div class="capture-icon"></div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="info-panel">
      <h2 id="panel-title">Nombre del Plato</h2>
      <p id="panel-desc">Descripción del plato aquí.</p>
      <span class="price" id="panel-price">S/ 0.00</span>
      <p style="font-size: 0.7rem; color: #aaa; margin-top: 5px;">(Pellizca para escalar)</p>
    </div>
    
    <a-scene 
      embedded 
      mindar-image="imageTargetSrc: /api/targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1;"
      renderer="colorManagement: true; precision: highp; antialias: true; alpha: true; preserveDrawingBuffer: true; pixelRatio: 2; powerPreference: high-performance; sortObjects: true; physicallyCorrectLights: true;"
      background="transparent: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      gesture-detector
      id="scene">

      <!-- Lighting (Optimized: No dynamic shadows, 2 Lights Only for Speed) -->
      <!-- 1. Ambient + Fill (Hemisphere): Simulates Sky/Ground reflection -->
      <a-light type="hemisphere" groundColor="#443333" color="#FFFAFA" intensity="1.8"></a-light>
      <!-- 2. Key Light (Directional): Simulates Sun/Ceiling Light -->
      <a-light type="directional" position="1 4 2" intensity="1.2" color="#FFF"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable" near="0.005" far="500"></a-camera>
    </a-scene>

    <script>
      (function () {
      // DYNAMIC SCENE GENERATION
      // Handled by catalog-loader.js

      // Global click handler for better touch response
      AFRAME.registerComponent('cursor-listener', {
        init: function () {
          this.el.addEventListener('click', function (evt) {
            // This is a backup listener in case the individual ones fail
            // It just logs for now
             console.log('Global click on', evt.detail.intersection.object.el.id);
          });
          
          // Also listen for mousedown/touchstart
          this.el.addEventListener('mousedown', function (evt) {
             console.log('Global mousedown on', evt.detail.intersection.object.el.id);
          });
        }
      });
        
    
      
      const debugText = document.getElementById('debug-text');
      const captureBtn = document.getElementById('capture-btn');
      const infoPanel = document.getElementById('info-panel');
      const panelTitle = document.getElementById('panel-title');
      const panelDesc = document.getElementById('panel-desc');
      const panelPrice = document.getElementById('panel-price');
      const flashOverlay = document.getElementById('flash-overlay');
      const statusIndicator = document.getElementById('status-indicator');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const retryWrap = document.getElementById('ar-retry');
      const adminBtn = document.getElementById('admin-btn');
      const adminHotspot = document.getElementById('admin-hotspot');

      const setStatus = (state, text) => {
        if (statusIndicator) statusIndicator.dataset.state = String(state || '');
        if (statusText) statusText.innerText = String(text || '');
      };
      const setRetryVisible = (visible) => {
        if (!retryWrap) return;
        if (visible) {
          if (!retryWrap.dataset.ready) {
            retryWrap.dataset.ready = '1';
            retryWrap.innerHTML = `
              <div class="retry-card" role="dialog" aria-modal="true">
                <div class="retry-title" id="retry-title">Activa la cámara</div>
                <div class="retry-sub" id="retry-sub">Toca el botón para pedir permiso y comenzar.</div>
                <button class="retry-btn" id="retry-btn" type="button">Activar cámara</button>
              </div>
            `;
            const btn = retryWrap.querySelector('#retry-btn');
            const onTry = (e) => {
              try { e?.preventDefault?.(); } catch (err) {}
              arUserActivated = true;
              startArIfReady();
            };
            if (btn) btn.addEventListener('click', onTry, { passive: false });
            retryWrap.addEventListener('click', (e) => {
              const target = e && e.target ? e.target : null;
              if (target && target.id === 'retry-btn') return;
            }, { passive: true });
          }
          retryWrap.style.display = 'flex';
        } else {
          retryWrap.style.display = 'none';
        }
      };

      const forceCameraLayers = () => {
        const apply = () => {
          try {
            const videos = document.querySelectorAll('video');
            for (const v of videos) {
              v.style.position = 'fixed';
              v.style.inset = '0';
              v.style.width = '100vw';
              v.style.height = '100vh';
              v.style.objectFit = 'cover';
              v.style.zIndex = '0';
              v.style.display = 'block';
              v.style.pointerEvents = 'none';
              v.setAttribute('playsinline', '');
              v.setAttribute('webkit-playsinline', '');
              v.muted = true;
              v.autoplay = true;
            }

            const canvases = document.querySelectorAll('.a-canvas, canvas.a-canvas');
            for (const c of canvases) {
              c.style.position = 'fixed';
              c.style.inset = '0';
              c.style.width = '100vw';
              c.style.height = '100vh';
              c.style.zIndex = '5';
              c.style.background = 'transparent';
              c.style.display = 'block';
              c.style.visibility = 'visible';
              c.style.opacity = '1';
              c.style.pointerEvents = 'none';
            }
            try {
              const scene = document.querySelector('a-scene');
              const c = scene && scene.canvas ? scene.canvas : null;
              if (c) {
                c.style.position = 'fixed';
                c.style.inset = '0';
                c.style.width = '100vw';
                c.style.height = '100vh';
                c.style.zIndex = '5';
                c.style.background = 'transparent';
                c.style.display = 'block';
                c.style.visibility = 'visible';
                c.style.opacity = '1';
                c.style.pointerEvents = 'none';
              }
            } catch (e) {}

            if (debugEnabled) {
              const debugEl = document.getElementById('debug-text');
              const scene = document.querySelector('a-scene');
              const c = scene && scene.canvas ? scene.canvas : null;
              const v = document.querySelector('video');
              if (debugEl) {
                const cz = c ? (c.style.zIndex || '') : '';
                const vz = v ? (v.style.zIndex || '') : '';
                const cc = c ? `canvas:${cz || '?'} ${c.clientWidth}x${c.clientHeight}` : 'canvas:NA';
                const vv = v ? `video:${vz || '?'} ${v.clientWidth}x${v.clientHeight}` : 'video:NA';
                debugEl.innerText = `${cc} | ${vv}`;
              }
            }
          } catch (e) {}
        };

        apply();
        let tries = 0;
        const maxTries = 120;
        const tick = () => {
          tries += 1;
          apply();
          if (tries < maxTries) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      };

      const host = String(location.hostname || '').toLowerCase();
      const isLocalHost = host === 'localhost' || host === '127.0.0.1';
      const debugEnabled = (() => {
        if (isLocalHost) return true;
        try {
          return new URLSearchParams(location.search).get('debug') === '1';
        } catch (e) {
          return false;
        }
      })();

      const getSessionId = () => {
        const key = 'webar_session_id';
        try {
          const existing = String(localStorage.getItem(key) || '').trim();
          if (existing) return existing;
        } catch (e) {}
        let id = '';
        try {
          if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
            const bytes = new Uint8Array(16);
            window.crypto.getRandomValues(bytes);
            id = Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
          }
        } catch (e) {}
        if (!id) id = `${Date.now().toString(16)}${Math.random().toString(16).slice(2)}`;
        try {
          localStorage.setItem(key, id);
        } catch (e) {}
        return id;
      };

      const trackUsage = () => {
        const payload = JSON.stringify({
          sessionId: getSessionId(),
          path: `${location.pathname || '/'}${location.search || ''}`
        });
        try {
          if (navigator && typeof navigator.sendBeacon === 'function') {
            const blob = new Blob([payload], { type: 'application/json' });
            navigator.sendBeacon('/api/analytics/track', blob);
            return;
          }
        } catch (e) {}
        try {
          fetch('/api/analytics/track', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
          }).catch(() => {});
        } catch (e) {}
      };

      trackUsage();
      if (debugText && !debugEnabled) debugText.style.display = 'none';
      if (adminBtn) adminBtn.style.display = debugEnabled ? 'flex' : 'none';

      const hideLoader = () => {
        const loader = document.getElementById('loader-overlay');
        if (!loader) return;
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
      };
      const canUseCamera = () => {
        const secure = !!window.isSecureContext || location.protocol === 'https:' || isLocalHost;
        if (!secure) {
          setStatus('error', 'La cámara requiere HTTPS o localhost');
          setRetryVisible(false);
          hideLoader();
          return false;
        }
        return true;
      };

      // Hide Loader when scene is ready
      const sceneEl = document.querySelector('a-scene');
      const getTargetsMindSrc = () => {
        if (typeof CONFIG !== 'undefined' && CONFIG && typeof CONFIG.getApiBaseUrl === 'function') {
          const base = CONFIG.getApiBaseUrl();
          if (base) return `${base}/api/targets.mind`;
        }
        return '/api/targets.mind';
      };

      const openLocalDb = () => new Promise((resolve, reject) => {
        const request = indexedDB.open('webar_local_assets', 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('blobs')) {
            db.createObjectStore('blobs', { keyPath: 'key' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      const getLocalBlob = async (key) => {
        const db = await openLocalDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('blobs', 'readonly');
          const store = tx.objectStore('blobs');
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result ? req.result.blob : null);
          req.onerror = () => reject(req.error);
        });
      };

      const canFetchWithTimeout = async (url, timeoutMs = 1200) => {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), timeoutMs);
          const res = await fetch(url, { method: 'HEAD', cache: 'no-store', signal: controller.signal });
          clearTimeout(timer);
          if (res.status === 405) return true;
          return res.ok;
        } catch (e) {
          return false;
        }
      };

      const verifyTargetsMind = async (url) => {
        if (!url || typeof url !== 'string') return false;
        if (url.startsWith('blob:')) return true;
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 1500);
          const res = await fetch(url, { method: 'HEAD', cache: 'no-store', signal: controller.signal });
          clearTimeout(timer);
          if (res.status === 405) return true;
          if (!res.ok) return false;
          const len = Number(res.headers.get('content-length') || 0);
          if (Number.isFinite(len) && len > 0 && len < 1000) return false;
          return true;
        } catch (e) {
          return false;
        }
      };

      const initTargetsMind = async () => {
        setStatus('loading', 'Cargando targets...');
        let src = getTargetsMindSrc();
        const ok = await verifyTargetsMind(src);
        if (!ok) {
          targetsReady = false;
          setStatus('error', 'No se pudo cargar targets.mind');
          setRetryVisible(true);
          hideLoader();
          return;
        }
        sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${src}; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1;`);
        targetsReady = true;
        setStatus('ready', 'Targets listos');
        startArIfReady();
      };

      let arSystem = null;
      let arStarted = false;
      let catalogReady = false;
      let targetsReady = false;
      let arUserActivated = true;
      let cameraStartAttempts = 0;
      let autoRetryTimer = null;
      let autoRetryDelayMs = 800;
      let adminShiftCount = 0;
      let adminShiftLastTs = 0;

      const openAdminPanel = () => {
        try {
          const url = '/admin/';
          const win = window.open(url, '_blank', 'noopener,noreferrer');
          if (win && typeof win.focus === 'function') win.focus();
          if (!win) location.href = url;
        } catch (e) {}
      };

      const preflightCameraPermission = async () => {
        if (!canUseCamera()) return { ok: false, reason: 'insecure' };
        try {
          const md = navigator && navigator.mediaDevices ? navigator.mediaDevices : null;
          if (!md || typeof md.getUserMedia !== 'function') return { ok: false, reason: 'unsupported' };
          const perms = navigator && navigator.permissions ? navigator.permissions : null;
          if (perms && typeof perms.query === 'function') {
            const res = await perms.query({ name: 'camera' });
            const state = String(res && res.state ? res.state : '');
            if (state === 'denied') return { ok: false, reason: 'denied' };
          }
          return { ok: true };
        } catch (err) {
          return { ok: true };
        }
      };

      const withTimeout = (promise, timeoutMs, timeoutMessage) => {
        let timer = null;
        const timeout = new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error(timeoutMessage || 'timeout')), timeoutMs);
        });
        return Promise.race([promise, timeout]).finally(() => {
          if (timer) clearTimeout(timer);
        });
      };

      let warmupDone = false;
      const warmupCameraOnce = async () => {
        if (warmupDone) return true;
        const md = navigator && navigator.mediaDevices ? navigator.mediaDevices : null;
        if (!md || typeof md.getUserMedia !== 'function') return false;
        let stream = null;
        try {
          const constraints = { video: { facingMode: { ideal: 'environment' } }, audio: false };
          stream = await withTimeout(md.getUserMedia(constraints), 8000, 'camera_warmup_timeout');
          const tracks = stream && typeof stream.getTracks === 'function' ? stream.getTracks() : [];
          for (const t of tracks) {
            try { t.stop(); } catch (e) {}
          }
          warmupDone = true;
          return true;
        } catch (e) {
          if (stream) {
            try {
              const tracks = stream.getTracks ? stream.getTracks() : [];
              for (const t of tracks) {
                try { t.stop(); } catch (e2) {}
              }
            } catch (e2) {}
          }
          return false;
        }
      };

      function startArIfReady() {
        if (arStarted) return;
        if (!arSystem) {
          setStatus('loading', 'Cargando motor AR...');
          return;
        }
        if (!targetsReady) {
          setStatus('loading', 'Cargando targets...');
          return;
        }
        if (!canUseCamera()) return;
        cameraStartAttempts += 1;
        arStarted = true;
        setStatus('scanning', 'Solicitando cámara...');
        setRetryVisible(false);
        Promise.resolve(preflightCameraPermission())
          .then((pre) => {
            if (!pre?.ok) {
              const r = String(pre?.reason || '');
              if (r === 'denied') throw new Error('permission_denied');
              if (r === 'unsupported') throw new Error('media_unsupported');
              if (r === 'notfound') throw new Error('camera_not_found');
            }
            return warmupCameraOnce().catch(() => false).then(() => withTimeout(Promise.resolve(arSystem.start()), 12000, 'camera_start_timeout'));
          })
          .then(() => {
            setStatus('scanning', 'Escaneando...');
            forceCameraLayers();
            if (autoRetryTimer) {
              clearTimeout(autoRetryTimer);
              autoRetryTimer = null;
            }
            autoRetryDelayMs = 800;
          })
          .catch((err) => {
            arStarted = false;
            console.error(err);
            const msg = String(err?.message || err || '').toLowerCase();
            if (msg.includes('camera_start_timeout')) {
              setStatus('scanning', 'Activando cámara...');
              setRetryVisible(false);
            }
            if (msg.includes('notallowed') || msg.includes('permission') || msg.includes('denied') || msg.includes('permission_denied')) {
              setStatus('scanning', 'Permite el acceso a la cámara');
              setRetryVisible(false);
            } else if (msg.includes('media_unsupported')) {
              setStatus('error', 'Tu navegador no soporta cámara en esta página.');
            } else if (msg.includes('camera_not_found') || msg.includes('notfound')) {
              setStatus('error', 'No se detectó cámara. Revisa tu dispositivo.');
            } else if (msg.includes('target') || msg.includes('mind') || msg.includes('compile')) {
              setStatus('error', 'No se pudo cargar targets.mind. Revisa que exista y reintenta.');
            } else {
              setStatus('scanning', 'Activando cámara...');
            }
            if (!autoRetryTimer) {
              autoRetryTimer = setTimeout(() => {
                autoRetryTimer = null;
                startArIfReady();
              }, autoRetryDelayMs);
              autoRetryDelayMs = Math.min(5000, Math.floor(autoRetryDelayMs * 1.6));
            }
          });
      }

      initTargetsMind();

      document.addEventListener('catalogloaded', () => {
        catalogReady = true;

        startArIfReady();
      });
      document.addEventListener('catalogerror', (e) => {
        catalogReady = false;

      const onSceneLoaded = () => {
        console.log("Scene loaded");
        arSystem = sceneEl.systems && sceneEl.systems["mindar-image-system"];
        if (sceneEl.renderer) {
          const mem = Number(navigator.deviceMemory || 0);
          const cores = Number(navigator.hardwareConcurrency || 0);
          const dpr = Math.max(1, Math.min(3, Number(window.devicePixelRatio || 1)));
          let cap = 2;
          if (mem && mem <= 4) cap = 1.5;
          if (cores && cores <= 4) cap = Math.min(cap, 1.5);
          sceneEl.renderer.setPixelRatio(Math.min(dpr, cap));
          if ('physicallyCorrectLights' in sceneEl.renderer) sceneEl.renderer.physicallyCorrectLights = true;
          if ('toneMapping' in sceneEl.renderer && typeof THREE !== 'undefined') sceneEl.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          if ('toneMappingExposure' in sceneEl.renderer) sceneEl.renderer.toneMappingExposure = 1.0;
        }
        startArIfReady();
        if (!catalogReady || !targetsReady) setStatus('loading', 'Preparando...');
        hideLoader();
      };

      if (sceneEl && sceneEl.hasLoaded) {
        onSceneLoaded();

        sceneEl.addEventListener('loaded', onSceneLoaded, { once: true });

      window.addEventListener('message', (event) => {

      document.addEventListener('visibilitychange', () => {

      window.addEventListener('pagehide', () => {
        if (!arSystem) return;

      let activeMarkerId = null;

      // Marker Handler Component
      AFRAME.registerComponent('marker-handler', {
        init: function() {
          const markerId = parseInt(this.el.id.split('-')[1]);
          const getVisibleTargetId = () => {
            if (typeof APP_DATA === 'undefined' || !Array.isArray(APP_DATA.models)) return null;
            for (const model of APP_DATA.models) {
              const marker = document.getElementById('marker-' + model.id);
              if (marker && (marker.getAttribute('visible') || marker.object3D?.visible)) return model.id;
            }
            return null;
          };
          
          this.el.addEventListener('targetFound', () => {
             const modelEl = document.getElementById('model-' + markerId);
             const placeholderEl = document.getElementById('placeholder-' + markerId);
             if (placeholderEl) {
               placeholderEl.setAttribute('visible', true);
             }
             try { this.el.object3D.visible = true; } catch (e) {}
             if (modelEl) {
               try { modelEl.setAttribute('visible', true); } catch (e) {}
               try { modelEl.object3D.visible = true; } catch (e) {}
               if (debugEnabled) {
                 try {
                   const id = `debug-cube-${markerId}`;
                   if (!document.getElementById(id)) {
                     const cube = document.createElement('a-box');
                     cube.setAttribute('id', id);
                     cube.setAttribute('position', '0 0 -0.03');
                     cube.setAttribute('width', '0.08');
                     cube.setAttribute('height', '0.08');
                     cube.setAttribute('depth', '0.08');
                     cube.setAttribute('color', '#ff00ff');
                     cube.setAttribute('material', 'opacity: 0.9; transparent: true');
                     this.el.appendChild(cube);
                   }
                 } catch (e) {}
               }

               const normalizeLoadedModel = () => {
                 try {
                   if (typeof THREE === 'undefined') return;
                   const root = modelEl.getObject3D('mesh');
                   if (!root) return;
                   if (modelEl.dataset.modelNormalized === '1') return;

                   try {
                     root.traverse((o) => {
                       if (o && o.isMesh) {
                         o.frustumCulled = false;
                         if (o.material) {
                           if (Array.isArray(o.material)) {
                             for (const m of o.material) {
                               if (m) {
                                 m.depthWrite = true;
                                 m.needsUpdate = true;
                               }
                             }
                           } else {
                             o.material.depthWrite = true;
                             o.material.needsUpdate = true;
                           }
                         }
                       }
                     });
                   } catch (e) {}

                   root.updateWorldMatrix(true, true);
                   const box = new THREE.Box3().setFromObject(root);
                   const size = new THREE.Vector3();
                   const center = new THREE.Vector3();
                   box.getSize(size);
                   box.getCenter(center);

                   const maxDim = Math.max(size.x, size.y, size.z);
                   if (!Number.isFinite(maxDim) || maxDim <= 0) return;

                   const desired = 0.6;
                   const scale = modelEl.object3D.scale.clone();
                   const currentUniform = Number.isFinite(scale.x) && scale.x !== 0 ? scale.x : 1;
                   const factor = desired / maxDim;
                   let next = currentUniform * factor;
                   if (!Number.isFinite(next) || next <= 0) next = factor;
                   next = Math.max(0.001, Math.min(50, next));
                   modelEl.object3D.scale.set(next, next, next);

                  root.updateWorldMatrix(true, true);
                  const box2 = new THREE.Box3().setFromObject(root);
                  const min = box2.min;
                  const c2 = new THREE.Vector3();
                  box2.getCenter(c2);

                  if (root.position) {
                    root.position.x -= c2.x;
                    root.position.y -= min.y;
                    root.position.z -= c2.z;
                    root.position.z -= 0.03;
                    root.position.y += 0.02;
                  }

                   modelEl.dataset.modelNormalized = '1';
                 } catch (e) {}
               };

               const applyLoadedState = () => {
                 normalizeLoadedModel();
                 if (placeholderEl) {
                   try { placeholderEl.setAttribute('visible', false); } catch (e) {}
                 }
                if (debugEnabled) {
                  const debugEl = document.getElementById('debug-text');
                  try {
                    const src = String(modelEl.getAttribute('gltf-model') || modelEl.getAttribute('data-gltf-src') || '').slice(0, 80);
                    const s = modelEl.object3D && modelEl.object3D.scale ? modelEl.object3D.scale.x : 0;
                    const p = modelEl.object3D && modelEl.object3D.position ? modelEl.object3D.position : null;
                    const meshOk = Boolean(modelEl.getObject3D && modelEl.getObject3D('mesh'));
                    if (debugEl) debugEl.innerText = `M${markerId} mesh:${meshOk ? '1' : '0'} s:${Number(s || 0).toFixed(2)} p:${p ? `${p.x.toFixed(2)},${p.y.toFixed(2)},${p.z.toFixed(2)}` : 'na'} src:${src}`;
                  } catch (e) {}
                }
                 setStatus('tracking', `Target ${markerId}`);
               };

               if (!modelEl.dataset.modelWired) {
                 modelEl.dataset.modelWired = '1';
                 modelEl.addEventListener('model-loaded', () => {
                   applyLoadedState();
                 });
                 modelEl.addEventListener('model-error', (ev) => {
                   const detail = ev && ev.detail ? ev.detail : null;
                   const raw = detail && (detail.src || detail.error || detail.message) ? (detail.src || detail.error || detail.message) : '';
                   const text = raw ? String(raw).slice(0, 160) : '';
                   setStatus('error', text ? `Modelo no cargó: ${text}` : 'Modelo no cargó');
                 });
               }

               const hasMesh = Boolean(modelEl.getObject3D && modelEl.getObject3D('mesh'));
               if (hasMesh) {
                 applyLoadedState();
               }

               const src = modelEl.getAttribute('data-gltf-src');
               const current = modelEl.getAttribute('gltf-model');
               if (src && (!current || String(current) !== String(src))) {
                 try { delete modelEl.dataset.modelNormalized; } catch (e) {}
                 try { modelEl.dataset.modelNormalized = '0'; } catch (e) {}
                 setStatus('loading', 'Cargando modelo...');
                 modelEl.setAttribute('gltf-model', src);
               } else if (!hasMesh) {
                 setStatus('loading', 'Cargando modelo...');
               }
             }
             setRetryVisible(false);
             const canTrackNow =
               !modelEl ||
               (modelEl.getObject3D && modelEl.getObject3D('mesh')) ||
               (!modelEl.getAttribute('gltf-model') && !modelEl.getAttribute('data-gltf-src'));
             if (canTrackNow) setStatus('tracking', `Target ${markerId}`);
             // First marker found becomes active automatically
             if (activeMarkerId === null) {
                 activeMarkerId = markerId;
                 // Force update immediately
                 updateState();
                 const debugEl = document.getElementById('debug-text');
                 if(debugEnabled && debugEl) debugEl.innerText = `Active: ${markerId}`;
             }
          });
          
          this.el.addEventListener('targetLost', () => {
             // If the lost marker was the active one, deselect it
             if (activeMarkerId === markerId) {
                 activeMarkerId = getVisibleTargetId();
                 updateState();
                 setStatus('scanning', 'Escaneando...');
                 
                 // Debug
                 const debugEl = document.getElementById('debug-text');
                 if(debugEnabled && debugEl) debugEl.innerText = `Lost: ${markerId}`;
             }
             const placeholderEl = document.getElementById('placeholder-' + markerId);
             if (placeholderEl) {
               try { placeholderEl.setAttribute('visible', false); } catch (e) {}
             }
          });
        }
      });
      
      // Gesture Detector
      AFRAME.registerComponent('gesture-detector', {
        schema: { element: { default: '' } },
        init: function () {
          // Force listening on document.body to ensure we catch all touches
          this.targetElement = document.body;
          
          this.internalState = {
            previousState: null
          };

          this.emitGestureEvent = this.emitGestureEvent.bind(this);
          this.targetElement.addEventListener('touchstart', this.emitGestureEvent, {passive: false});
          this.targetElement.addEventListener('touchend', this.emitGestureEvent, {passive: false});
          this.targetElement.addEventListener('touchmove', this.emitGestureEvent, {passive: false});
        },
        remove: function () {
          this.targetElement.removeEventListener('touchstart', this.emitGestureEvent);
          this.targetElement.removeEventListener('touchend', this.emitGestureEvent);
          this.targetElement.removeEventListener('touchmove', this.emitGestureEvent);
        },
        emitGestureEvent: function (event) {
          // Prevent default browser behavior (scroll/zoom)
          if (event.type === 'touchmove') {
            event.preventDefault();
          }

          const currentState = this.getTouchState(event);
          const previousState = this.internalState.previousState;
          
          const gestureContinues = previousState && currentState && currentState.touchCount == previousState.touchCount;
          const gestureEnded = previousState && !gestureContinues;
          const gestureStarted = currentState && !gestureContinues;

          if (gestureEnded) {
            const eventName = previousState.touchCount === 1 ? 'onefingerend' : 'twofingerend';
            this.el.emit(eventName, { 
                position: previousState.position, 
                spread: previousState.spread 
            });
            this.internalState.previousState = null;
          }

          if (gestureStarted) {
            currentState.startTime = performance.now();
            currentState.startPosition = currentState.position;
            currentState.startSpread = currentState.spread;
            const eventName = currentState.touchCount === 1 ? 'onefingerstart' : 'twofingerstart';
            this.el.emit(eventName, currentState);
            this.internalState.previousState = currentState;
          }

          if (gestureContinues) {
            const eventElapsed = performance.now() - previousState.startTime;
            const eventName = currentState.touchCount === 1 ? 'onefingermove' : 'twofingermove';
            const detail = {
              position: currentState.position,
              spread: currentState.spread,
              startSpread: previousState.startSpread, // Propagate startSpread
              startPosition: previousState.startPosition,
              elapsedTime: eventElapsed
            };
            this.el.emit(eventName, detail);
            this.internalState.previousState = { ...currentState, startTime: previousState.startTime, startSpread: previousState.startSpread, startPosition: previousState.startPosition };
          }
        },
        getTouchState: function (event) {
          if (event.touches.length === 0) return null;
          if (event.touches.length === 1) {
            return {
              touchCount: 1,
              position: { x: event.touches[0].pageX, y: event.touches[0].pageY },
              spread: 0
            };
          } else if (event.touches.length === 2) {
            const spread = Math.hypot(
              event.touches[0].pageX - event.touches[1].pageX,
              event.touches[0].pageY - event.touches[1].pageY
            );
            return {
              touchCount: 2,
              position: { x: (event.touches[0].pageX + event.touches[1].pageX) / 2, y: (event.touches[0].pageY + event.touches[1].pageY) / 2 },
              spread: spread
            };
          }
          return null;
        }
      });

      // Model Controller
      AFRAME.registerComponent('model-controller', {
        schema: {
          minScale: { default: 0.1 },
          maxScale: { default: 20.0 },
          rotationSpeed: { default: 1.5 }, // Increased sensitivity
        },
        init: function () {
          this.sceneEl = document.querySelector('a-scene');
          this.handleTwoFingerStart = this.handleTwoFingerStart.bind(this);
          this.handleTwoFingerMove = this.handleTwoFingerMove.bind(this);
          this.handleTwoFingerEnd = this.handleTwoFingerEnd.bind(this);
          this.handleOneFingerMove = this.handleOneFingerMove.bind(this);
          this.handleOneFingerStart = this.handleOneFingerStart.bind(this);
          
          this.lastSpread = null;
          this.lastX = null;

          this.sceneEl.addEventListener('twofingerstart', this.handleTwoFingerStart);
          this.sceneEl.addEventListener('twofingermove', this.handleTwoFingerMove);
          this.sceneEl.addEventListener('twofingerend', this.handleTwoFingerEnd);
          this.sceneEl.addEventListener('onefingermove', this.handleOneFingerMove);
          this.sceneEl.addEventListener('onefingerstart', this.handleOneFingerStart);
        },
        remove: function () {
          this.sceneEl.removeEventListener('twofingerstart', this.handleTwoFingerStart);
          this.sceneEl.removeEventListener('twofingermove', this.handleTwoFingerMove);
          this.sceneEl.removeEventListener('twofingerend', this.handleTwoFingerEnd);
          this.sceneEl.removeEventListener('onefingermove', this.handleOneFingerMove);
          this.sceneEl.removeEventListener('onefingerstart', this.handleOneFingerStart);
        },
        handleTwoFingerStart: function(event) {
            this.lastSpread = event.detail.spread;
            const debugEl = document.getElementById('debug-text');
            if(debugEl) debugEl.innerText = `Zoom Start: ${this.lastSpread.toFixed(1)}`;
        },
        handleTwoFingerMove: function (event) {
            const currentSpread = event.detail.spread;

            // Robust initialization if start event was missed
            if (this.lastSpread === null || this.lastSpread === 0) {
                this.lastSpread = currentSpread;
                return;
            }

            const delta = currentSpread - this.lastSpread;
            
            // Check for active marker, BUT also allow if there's only one model visible to be safe
            let targetId = activeMarkerId;
            if (targetId === null) {
               // Fallback: try to find a visible model wrapper
               if (typeof APP_DATA !== 'undefined' && APP_DATA.models) {
                   for (const model of APP_DATA.models) {
                       const marker = document.getElementById('marker-' + model.id);
                       if (marker && (marker.getAttribute('visible') || marker.object3D?.visible)) {
                           targetId = model.id;
                           break;
                       }
                   }
               }
            }
            
            if (targetId === null || this.el.id !== 'model-' + targetId) return;

            // Linear Zoom: Scale based on delta * factor
            // Using current scale as a factor makes it feel proportional but controlled
            const factor = 0.005 * this.el.object3D.scale.x;
            let newScale = this.el.object3D.scale.x + (delta * factor);

            // Safety clamp
            newScale = Math.min(Math.max(newScale, this.data.minScale), this.data.maxScale);
            
            this.el.object3D.scale.set(newScale, newScale, newScale);
            
            this.lastSpread = currentSpread;

            // Debug
            const debugEl = document.getElementById('debug-text');
            if(debugEl) debugEl.innerText = `Zoom: ${newScale.toFixed(2)} (M${targetId})`;
        },
        handleTwoFingerEnd: function () {
            this.lastSpread = null;
            const debugEl = document.getElementById('debug-text');
            if(debugEl) debugEl.innerText = `Zoom End`;
        },
        handleOneFingerStart: function(event) {
            this.lastX = event.detail.position.x;
            const debugEl = document.getElementById('debug-text');
            if(debugEl) debugEl.innerText = `Rot Start: ${this.lastX.toFixed(1)}`;
        },
        handleOneFingerMove: function(event) {
            // Robust initialization
            if (this.lastX === null) {
                this.lastX = event.detail.position.x;
                return;
            }

            const deltaX = event.detail.position.x - this.lastX;
            this.lastX = event.detail.position.x;
            
            // Check for active marker, BUT also allow if there's only one model visible to be safe
            let targetId = activeMarkerId;
            if (targetId === null) {
               // Fallback: try to find a visible model wrapper
               if (typeof APP_DATA !== 'undefined' && APP_DATA.models) {
                   for (const model of APP_DATA.models) {
                       const marker = document.getElementById('marker-' + model.id);
                       if (marker && (marker.getAttribute('visible') || marker.object3D?.visible)) {
                           targetId = model.id;
                           break;
                       }
                   }
               }
            }

            if (targetId === null || this.el.id !== 'model-' + targetId) return;
            
            this.el.object3D.rotation.y += deltaX * (this.data.rotationSpeed * 0.01);

            // Debug
            const debugEl = document.getElementById('debug-text');
            if(debugEl) debugEl.innerText = `Rot: ${this.el.object3D.rotation.y.toFixed(2)} (M${targetId})`;
        }
      });


      // Dish Data (Loaded from app-data.js)
      const dishes = {};
      
      const setDishesFromModels = (models) => {
        for (const key of Object.keys(dishes)) delete dishes[key];

        (models || []).forEach((model) => {
          dishes[model.id] = {
            name: model.name,
            desc: model.desc,
            price: model.price,
            details: model.details
          };
        });

        updateState();
      };

      document.addEventListener('catalogloaded', (event) => {
        const models = event?.detail?.models;
        if (Array.isArray(models)) setDishesFromModels(models);
      });

      if (typeof APP_DATA !== 'undefined' && Array.isArray(APP_DATA.models) && APP_DATA.models.length) {
        setDishesFromModels(APP_DATA.models);
      }

      // Info Modal Elements
      const infoBtn = document.getElementById('info-btn');
      const detailModal = document.getElementById('detail-modal');
      const closeModal = document.getElementById('close-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalIngredients = document.getElementById('modal-ingredients');
      const modalCalories = document.getElementById('modal-calories');
      const modalTime = document.getElementById('modal-time');
      const modalChefNote = document.getElementById('modal-chef-note');

      // Modal Logic
      infoBtn.addEventListener('click', () => {
        if (activeMarkerId !== null && dishes[activeMarkerId]) {
          const dish = dishes[activeMarkerId];
          modalTitle.innerText = dish.name;
          modalIngredients.innerText = dish.details.ingredients;

          modalChefNote.innerText = `"${dish.details.chefNote}"`;
          
          detailModal.style.display = 'flex';
        }
      });

      closeModal.addEventListener('click', () => {
        detailModal.style.display = 'none';
      });

      detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) {
          detailModal.style.display = 'none';
        }
      });

      const scene = document.querySelector('a-scene');

      // SECRET ADMIN PANEL SHORTCUT (CTRL + SHIFT + A)
      document.addEventListener('keydown', function(event) {
          if (event.ctrlKey && event.shiftKey && (event.key === 'A' || event.key === 'a')) {
              event.preventDefault();
              window.location.href = '/admin/';
          }
      });

      // Debug: Log all clicks on scene to see what's being hit
      scene.addEventListener('click', (evt) => {
        // Only log if not stopped
        console.log("Scene click", evt.target);
      });

      // Photo Capture Logic
      captureBtn.addEventListener('click', function() {
        const video = document.querySelector('video');
        const scene = document.querySelector('a-scene');
        const glCanvas = scene.canvas; // The WebGL canvas

        // Force a render to ensure the canvas is up to date
        scene.renderer.render(scene.object3D, scene.camera);

        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = window.innerWidth;
        captureCanvas.height = window.innerHeight;
        const ctx = captureCanvas.getContext('2d');

        // 1. Draw Camera Feed (Video) - Handle "object-fit: cover" aspect ratio
        if (video) {
            const videoRatio = video.videoWidth / video.videoHeight;
            const screenRatio = captureCanvas.width / captureCanvas.height;
            
            let drawWidth, drawHeight, startX, startY;

            if (screenRatio > videoRatio) {
                // Screen is wider than video (crop top/bottom)
                drawWidth = captureCanvas.width;
                drawHeight = drawWidth / videoRatio;
                startX = 0;
                startY = (captureCanvas.height - drawHeight) / 2;
            } else {
                // Screen is taller than video (crop sides)
                drawHeight = captureCanvas.height;
                drawWidth = drawHeight * videoRatio;
                startX = (captureCanvas.width - drawWidth) / 2;
                startY = 0;
            }
            
            ctx.drawImage(video, startX, startY, drawWidth, drawHeight);
        }

        // 2. Draw WebGL Scene (Models)
        // Note: preserveDrawingBuffer: true is required in a-scene renderer config
        ctx.drawImage(glCanvas, 0, 0, captureCanvas.width, captureCanvas.height);

        // 3. Flash Effect
        const flash = document.createElement('div');
        flash.style.position = 'fixed';
        flash.style.top = '0';
        flash.style.left = '0';
        flash.style.width = '100%';
        flash.style.height = '100%';
        flash.style.backgroundColor = 'white';
        flash.style.opacity = '1';
        flash.style.zIndex = '9999';
        flash.style.transition = 'opacity 0.5s ease-out';
        document.body.appendChild(flash);
        
        // Trigger reflow
        void flash.offsetWidth;
        flash.style.opacity = '0';
        setTimeout(() => document.body.removeChild(flash), 500);

        // 4. Download
        const link = document.createElement('a');
        link.download = 'sushi-ar-' + Date.now() + '.png';
        link.href = captureCanvas.toDataURL('image/png');
        link.click();
      });

      // Component to make entities face the camera (Billboard)
      AFRAME.registerComponent('billboard', {
        tick: function() {
          const camera = this.el.sceneEl.camera;
          if (!camera) return;
          this.el.object3D.lookAt(camera.el.object3D.position);
        }
      });

      // Component to handle clicks on specific entities (Raycaster)
      AFRAME.registerComponent('click-handler', {
        init: function () {
          this.el.addEventListener('click', (evt) => {
             let id = null;
             
             if (this.el.id && this.el.id.startsWith('model-')) {
                 id = parseInt(this.el.id.split('-')[1]);
                 console.log("Raycaster clicked model:", id);
             } 

             if (id !== null) {
                 // Visual feedback for the click
                 const debugEl = document.getElementById('debug-text');
                 if (debugEl) debugEl.innerHTML = `CLICKED: M${id}`;

                 if (activeMarkerId !== id) {
                    activeMarkerId = id;
                    updateState();
                 }
             }
          });
          
          // Also listen for touchstart directly on the entity for faster response
          this.el.addEventListener('touchstart', (evt) => {
             let id = null;
             
             if (this.el.id && this.el.id.startsWith('model-')) {
                 id = parseInt(this.el.id.split('-')[1]);
                 console.log("Raycaster touchstart model:", id);
             }

             if (id !== null) {
                 // Visual feedback
                 const debugEl = document.getElementById('debug-text');
                 if (debugEl) debugEl.innerText = `TOUCH: M${id}`;
                 
                 if (activeMarkerId !== id) {
                    activeMarkerId = id;
                    updateState();
                 }
             }
          });
        }
      });

      // Update Info Panel based on activeMarkerId
      function updateState() {
        if (activeMarkerId !== null && dishes[activeMarkerId]) {
          const dish = dishes[activeMarkerId];
          panelTitle.innerText = dish.name;
          panelDesc.innerText = dish.desc;
          panelPrice.innerText = dish.price;
          infoPanel.classList.add('visible');
          
          // Show Info Button
          const infoBtn = document.getElementById('info-btn');
          if(infoBtn) infoBtn.classList.add('visible');
        } else {
          infoPanel.classList.remove('visible');
          
          // Hide Info Button
          const infoBtn = document.getElementById('info-btn');
          if(infoBtn) infoBtn.classList.remove('visible');
        }
      }

      // Add simple keyframe animation for the tap feedback
      const style = document.createElement('style');
      style.innerHTML = `
        @keyframes ping {
          0% { transform: scale(0.5); opacity: 1; }
          100% { transform: scale(2); opacity: 0; }
        }
      `;
      document.head.appendChild(style);

      // ---------------------------------------------------------
      })();
    </script>
  </body>
</html>
