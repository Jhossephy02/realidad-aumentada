<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>WebAR NFT Menu - Zelva Nikkei</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <!-- A-Frame 1.3.0 as requested for stability -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for Image Tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <!-- A-Frame Extras for Animation -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
      /* --- LOADER --- */
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        transition: opacity 0.5s ease;
      }

      .arjs-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid #ff9800; /* Orange accent */
        width: 50px;
        height: 50px;
        -webkit-animation: spin 1s linear infinite; /* Safari */
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-text {
        font-size: 1.2rem;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* --- INTERACTION UI (Floating Button) --- */
      #interaction-ui {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(150%); /* Hidden initially */
        width: 90%;
        max-width: 350px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        z-index: 1000;
        text-align: center;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #interaction-ui.visible {
        transform: translateX(-50%) translateY(0);
      }

      #dish-name {
        margin: 0;
        font-size: 1.5rem;
        color: #333;
        font-weight: 700;
      }

      #dish-price {
        font-size: 1.2rem;
        color: #4caf50;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .whatsapp-btn {
        background-color: #25D366;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .whatsapp-btn:active {
        transform: scale(0.95);
        box-shadow: 0 2px 8px rgba(37, 211, 102, 0.4);
      }

      .whatsapp-icon {
        width: 20px;
        height: 20px;
        fill: white;
      }
      
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  
  <body>
    <!-- LOADER -->
    <div class="arjs-loader" id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Cargando Menú AR...</div>
    </div>

    <!-- INTERACTION UI -->
    <div id="interaction-ui">
      <h2 id="dish-name">Nombre del Plato</h2>
      <span id="dish-price">S/ 0.00</span>
      <a href="#" id="whatsapp-link" class="whatsapp-btn" target="_blank">
        <svg class="whatsapp-icon" viewBox="0 0 24 24">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.654-.698c.991.551 2.046.853 3.19.853 3.18 0 5.768-2.587 5.768-5.766 0-3.181-2.587-5.767-5.767-5.767zm8.267 5.767c0 4.555-3.711 8.266-8.267 8.266-1.503 0-2.887-.411-4.102-1.121l-4.593 1.206 1.229-4.47c-.777-1.285-1.229-2.784-1.229-4.394 0-4.555 3.71-8.267 8.266-8.267 4.555 0 8.267 3.712 8.267 8.267z"/>
        </svg>
        Pedir por WhatsApp
      </a>
    </div>

    <!-- SCENE -->
    <!-- Optimization: logarithmicDepthBuffer for z-fighting, physicallyCorrectLights for realism -->
    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true; antialias: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <!-- Lighting Setup Optimized for Food Realism -->
      <!-- Hemisphere light for natural fill and 3D form (Sky vs Ground) -->
      <a-light type="hemisphere" color="#ffffff" groundColor="#444444" intensity="1.2"></a-light>
      <!-- Main Directional Key Light (Warm, casting shadows) -->
      <a-light type="directional" position="3 5 2" intensity="2.5" color="#fff5e6" castShadow="true" shadow-bias="-0.001"></a-light>
      <!-- Rim/Back Light to separate food from background (Cooler/Bright) -->
      <a-light type="point" position="-2 4 -3" intensity="3.0" distance="10" decay="2" color="#ffeebb"></a-light>

      <!-- Camera -->
      <a-entity camera>
          <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
      </a-entity>

    </a-scene>

    <script>
      // Global State
      let activeDish = null;

      // Component to handle interactions
      AFRAME.registerComponent('dish-interaction', {
        schema: {
          name: {type: 'string', default: ''},
          price: {type: 'string', default: ''},
          phone: {type: 'string', default: '51999999999'} // Replace with real number
        },
        init: function () {
          const el = this.el;
          const data = this.data;
          
          // Click event
          el.addEventListener('click', () => {
             console.log('Clicked dish:', data.name);
             showInteractionUI(data);
          });
          
          // Touch event (backup)
          el.addEventListener('touchstart', () => {
             console.log('Touched dish:', data.name);
             showInteractionUI(data);
          });

          // Marker Found/Lost events (attached to parent a-nft, but we can listen here if propagated)
        }
      });

      // UI Logic
      const uiPanel = document.getElementById('interaction-ui');
      const nameEl = document.getElementById('dish-name');
      const priceEl = document.getElementById('dish-price');
      const whatsappBtn = document.getElementById('whatsapp-link');
      const loader = document.getElementById('loader');

      function showInteractionUI(data) {
        nameEl.textContent = data.name;
        priceEl.textContent = data.price;
        
        // WhatsApp Link Generator
        const message = encodeURIComponent(`Hola, quisiera pedir el plato: ${data.name} (${data.price}) que vi en el menú AR.`);
        whatsappBtn.href = `https://wa.me/${data.phone}?text=${message}`;
        
        uiPanel.classList.add('visible');
      }

      // Hide loader when AR system is ready (approximate)
      window.addEventListener('arjs-nft-loaded', () => {
          loader.classList.add('hidden');
      });
      // Fallback in case event doesn't fire
      setTimeout(() => {
          loader.classList.add('hidden');
      }, 5000);

      // Main Logic: Load JSON and build scene
      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');

        fetch('data/platos.json')
          .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
          })
          .then(data => {
            if (!data.platos || !Array.isArray(data.platos)) {
              throw new Error('Invalid JSON format');
            }

            data.platos.forEach(plato => {
              // Create <a-nft> entity
              const nft = document.createElement('a-nft');
              
              // Configure NFT properties for Extreme Stability
              nft.setAttribute('type', 'nft');
              nft.setAttribute('url', plato.descriptor); // Path to .fset/.iset (without extension)
              nft.setAttribute('smooth', 'true');
              nft.setAttribute('smoothCount', '15');
              nft.setAttribute('smoothTolerance', '0.02');
              nft.setAttribute('smoothThreshold', '5');
              nft.setAttribute('id', `nft-${plato.nombre.replace(/\s+/g, '-')}`);

              // Create Model Entity
              const model = document.createElement('a-entity');
              model.setAttribute('gltf-model', plato.modelo);
              
              // Scale, Position, Rotation
              // Note: NFT markers often require larger scales (e.g. 100-200) depending on descriptor generation
              // Using JSON values but they might need adjustment.
              // For safety, let's use the JSON values but wrapped in a parent that handles the NFT scale factor if needed.
              // Usually NFT requires a scale of ~150 to match 150px image width. 
              // Let's assume the JSON scales are relative to the marker size.
              // A common pattern is: Marker -> Entity (scale 100-200) -> Model (scale from JSON)
              
              // Direct application for now:
              // Adjust scale for NFT: The model needs to be visible. 
              // If we assume the JSON scale is for Marker-based AR (1 unit = 1 meter), 
              // NFT units are pixels. 1 meter ~ 100-150 pixels typically.
              // So we multiply scale by ~100? Or just use as is?
              // Let's stick to the JSON scale first. If it's too small, the user can prompt to fix.
              // Actually, I'll multiply by 150 to be safe for NFT visibility.
              // Wait, previous prompt set scales like "3.5". If I use 3.5 in NFT it will be microscopic (3.5 pixels).
              // I will wrap the model in a container scaled to 150 (typical marker width) and apply the JSON scale inside.
              
              const container = document.createElement('a-entity');
              container.setAttribute('scale', '150 150 150'); // Base NFT scale
              container.setAttribute('rotation', '-90 0 0'); // Fix orientation for flat image
              
              model.setAttribute('scale', plato.escala);
              model.setAttribute('position', '0 0 0'); // Centered
              model.setAttribute('animation-mixer', 'loop: repeat');
              model.setAttribute('class', 'clickable'); // For raycaster
              
              // Add interaction component
              model.setAttribute('dish-interaction', `name: ${plato.nombre}; price: ${plato.precio}`);

              // Assemble
              container.appendChild(model);
              nft.appendChild(container);
              scene.appendChild(nft);
              
              console.log(`Loaded dish: ${plato.nombre}`);
            });
          })
          .catch(error => {
            console.error('Error loading menu data:', error);
            const loaderText = document.querySelector('.loader-text');
            if (loaderText) loaderText.textContent = 'Error cargando menú :(';
          });
      });
    </script>
  </body>
</html>
