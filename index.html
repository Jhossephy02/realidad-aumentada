<!DOCTYPE html>
<html>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Experience</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@v1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script>
      if (typeof AFRAME !== 'undefined') {
        AFRAME.registerComponent('drag-rotate-scale', {
          schema: {
            minScale: {default: 0.5},
            maxScale: {default: 2.5},
            rotationFactor: {default: 0.4},
            zoomFactor: {default: 0.015}
          },
          init: function () {
            this.isDragging = false;
            this.previousPosition = null;
            this.initialScale = this.el.object3D.scale.x || 1;
            this.scaleFactor = 1;
            this.pinchDistance = null;
            this.onMouseDown = this.handleMouseDown.bind(this);
            this.onMouseMove = this.handleMouseMove.bind(this);
            this.onMouseUp = this.handleMouseUp.bind(this);
            this.onWheel = this.handleWheel.bind(this);
            this.onTouchStart = this.handleTouchStart.bind(this);
            this.onTouchMove = this.handleTouchMove.bind(this);
            this.onTouchEnd = this.handleTouchEnd.bind(this);
            var canvas = this.el.sceneEl.canvas;
            if (canvas) {
              this.addListeners(canvas);
            } else {
              this.el.sceneEl.addEventListener('loaded', () => {
                this.addListeners(this.el.sceneEl.canvas);
              });
            }
          },
          remove: function () {
            var canvas = this.el.sceneEl && this.el.sceneEl.canvas;
            if (canvas) {
              this.removeListeners(canvas);
            }
          },
          addListeners: function (canvas) {
            canvas.addEventListener('mousedown', this.onMouseDown);
            window.addEventListener('mousemove', this.onMouseMove);
            window.addEventListener('mouseup', this.onMouseUp);
            canvas.addEventListener('wheel', this.onWheel, {passive: false});
            canvas.addEventListener('touchstart', this.onTouchStart, {passive: false});
            canvas.addEventListener('touchmove', this.onTouchMove, {passive: false});
            canvas.addEventListener('touchend', this.onTouchEnd);
            canvas.addEventListener('touchcancel', this.onTouchEnd);
          },
          removeListeners: function (canvas) {
            canvas.removeEventListener('mousedown', this.onMouseDown);
            window.removeEventListener('mousemove', this.onMouseMove);
            window.removeEventListener('mouseup', this.onMouseUp);
            canvas.removeEventListener('wheel', this.onWheel);
            canvas.removeEventListener('touchstart', this.onTouchStart);
            canvas.removeEventListener('touchmove', this.onTouchMove);
            canvas.removeEventListener('touchend', this.onTouchEnd);
            canvas.removeEventListener('touchcancel', this.onTouchEnd);
          },
          handleMouseDown: function (evt) {
            this.isDragging = true;
            this.previousPosition = {x: evt.clientX, y: evt.clientY};
          },
          handleMouseMove: function (evt) {
            if (!this.isDragging) return;
            var dx = evt.clientX - this.previousPosition.x;
            this.previousPosition = {x: evt.clientX, y: evt.clientY};
            var rotation = this.el.object3D.rotation;
            rotation.y += dx * this.data.rotationFactor * 0.01;
          },
          handleMouseUp: function () {
            this.isDragging = false;
          },
          handleWheel: function (evt) {
            evt.preventDefault();
            var delta = evt.deltaY;
            var factor = this.scaleFactor - delta * this.data.zoomFactor * 0.01;
            this.setScaleFactor(factor);
          },
          handleTouchStart: function (evt) {
            if (evt.touches.length === 1) {
              this.isDragging = true;
              this.previousPosition = {x: evt.touches[0].clientX, y: evt.touches[0].clientY};
            } else if (evt.touches.length === 2) {
              this.isDragging = false;
              this.pinchDistance = this.getTouchDistance(evt.touches[0], evt.touches[1]);
            }
          },
          handleTouchMove: function (evt) {
            if (evt.touches.length === 1 && this.isDragging) {
              var touch = evt.touches[0];
              var dx = touch.clientX - this.previousPosition.x;
              this.previousPosition = {x: touch.clientX, y: touch.clientY};
              var rotation = this.el.object3D.rotation;
              rotation.y += dx * this.data.rotationFactor * 0.01;
            } else if (evt.touches.length === 2 && this.pinchDistance !== null) {
              var newDistance = this.getTouchDistance(evt.touches[0], evt.touches[1]);
              var ratio = newDistance / this.pinchDistance;
              this.pinchDistance = newDistance;
              var factor = this.scaleFactor * ratio;
              this.setScaleFactor(factor);
            }
          },
          handleTouchEnd: function () {
            this.isDragging = false;
            this.pinchDistance = null;
          },
          getTouchDistance: function (t1, t2) {
            var dx = t1.clientX - t2.clientX;
            var dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
          },
          setScaleFactor: function (factor) {
            var min = this.data.minScale;
            var max = this.data.maxScale;
            this.scaleFactor = Math.min(max, Math.max(min, factor));
            var s = this.initialScale * this.scaleFactor;
            this.el.object3D.scale.set(s, s, s);
          }
        });
      }
    </script>
    <style>
      :root {
        --primary-color: #ff4757;
        --secondary-color: #2f3542;
        --accent-color: #ffffff;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
      }
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: radial-gradient(circle, #2f3542 0%, #000000 100%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top: 5px solid var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .ui-container {
        position: absolute;
        bottom: 40px;
        left: 0;
        right: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      .hint-text {
        background: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        margin-bottom: 20px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: fadeInOut 3s infinite;
      }
      @keyframes fadeInOut {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 30px;
        pointer-events: auto;
      }
      .screenshot-btn {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 5px solid white;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
        position: relative;
      }
      .screenshot-btn::after {
        content: '';
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 50%;
        transition: all 0.2s;
      }
      .screenshot-btn:active {
        transform: scale(0.9);
      }
      .screenshot-btn:active::after {
        transform: scale(0.8);
        background: var(--primary-color);
      }
      .header-ui {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1000;
        color: white;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      .header-ui h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 2px;
        font-weight: 300;
        text-transform: uppercase;
      }
      .flash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        z-index: 2000;
        opacity: 0;
        pointer-events: none;
      }
      .flash.active {
        animation: flashAnim 0.5s;
      }
      @keyframes flashAnim {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
      .product-panel {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.7);
        color: #ffffff;
        padding: 12px 16px;
        border-radius: 12px;
        max-width: 260px;
        font-size: 13px;
        display: none;
        backdrop-filter: blur(6px);
      }
      .product-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .product-price {
        font-weight: 500;
        margin-bottom: 8px;
      }
      .product-section-title {
        font-size: 12px;
        opacity: 0.9;
        margin-bottom: 2px;
      }
      .product-ingredients {
        font-size: 12px;
        line-height: 1.4;
      }
      .camera-error {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #000;
        color: #fff;
        padding: 10px 16px;
        z-index: 3000;
        font-size: 14px;
      }
      .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 0;
        background: #000;
      }
      .a-canvas {
        background-color: transparent !important;
      }
    </style>
  </head>

      const modelImages = {

      };
      
      const adminStorageKey = 'adminPlatosAR';
      
      (function integrateAdminDishes() {
        let raw;
        try {
          raw = localStorage.getItem(adminStorageKey);
        } catch (e) {
          return;
        }
        if (!raw) return;
        let platos;
        try {
          platos = JSON.parse(raw);
        } catch (e) {
          return;
        }
        if (!Array.isArray(platos)) return;
        const scene = document.querySelector('a-scene');
        if (!scene) return;
        const assets = scene.querySelector('a-assets');
        if (!assets) return;
        platos.forEach(function(p) {
          if (!p || !p.marcador || !p.modelo || !p.imagen || !p.nombre || !p.precio || !p.descripcion || !p.tipo) {
            return;
          }
          const modelId = 'admin-model-' + p.marcador;
          if (!assets.querySelector('#' + modelId)) {
            const asset = document.createElement('a-asset-item');
            asset.setAttribute('id', modelId);
            let src = p.modelo;
            if (src.indexOf('./') !== 0) {
              src = './' + src.replace(/^\/+/, '');
            }
            asset.setAttribute('src', src);
            assets.appendChild(asset);
          }
          const productsKey = p.marcador;
          if (!products[productsKey]) {
            products[productsKey] = {
              title: p.nombre,
              price: 'S/ ' + p.precio,
              ingredients: p.descripcion
            };
          }
          if (!modelImages[modelId]) {
            modelImages[modelId] = p.imagen;
          }
          const tipo = p.tipo;
          const folder = tipo === 'cafe' || tipo === 'hamburguesa' || tipo === 'pizza' || tipo === 'sushi' ? tipo : 'cafe';
          const markerUrl = "./zip´s/" + folder + "/" + p.marcador;
          const nft = document.createElement('a-nft');
          nft.setAttribute('type', 'nft');
          nft.setAttribute('url', markerUrl);
          nft.setAttribute('emitevents', 'true');
          nft.setAttribute('smooth', 'true');
          nft.setAttribute('smoothCount', '20');
          nft.setAttribute('smoothTolerance', '0.002');
          nft.setAttribute('smoothThreshold', '2');
          nft.setAttribute('data-product-key', productsKey);
          const entity = document.createElement('a-entity');
          entity.setAttribute('gltf-model', '#' + modelId);
          entity.setAttribute('scale', '4 4 4');
          entity.setAttribute('position', '0 -1.2 0');
          entity.setAttribute('rotation', '0 0 0');
          entity.setAttribute('drag-rotate-scale', 'minScale: 0.5; maxScale: 2; rotationFactor: 0.5');
          nft.appendChild(entity);
          scene.appendChild(nft);
        });
      })();
      
      function getProductKeyFromMarker(marker) {
        const custom = marker.getAttribute('data-product-key');
        if (custom) return custom;
        const url = marker.getAttribute('url') || '';
        const value = marker.getAttribute('value');
        const preset = marker.getAttribute('preset');
        if (url.indexOf('cafe') !== -1 || url.indexOf('caffe') !== -1 || url.indexOf('taza_cafe') !== -1) return 'cafe';
        if (url.indexOf('sushi_roll') !== -1 || url.indexOf('sushi_rolls') !== -1) return 'sushi_rolls';
        if (url.indexOf('sushi_salmon') !== -1 || url.indexOf('nigiri') !== -1) return 'nigiri';
        if (url.indexOf('sushi') !== -1) return 'sushi';
        if (url.indexOf('rebanada_pizza') !== -1 || url.indexOf('pizza_slice') !== -1) return 'pizza_slice';
        if (url.indexOf('pizza') !== -1) return 'pizza';
        if (url.indexOf('papas_fritas') !== -1 || url.indexOf('fries') !== -1) return 'fries';
        if (url.indexOf('hotdog') !== -1) return 'hotdog';
        if (url.indexOf('nuggets') !== -1) return 'nuggets';
        if (url.indexOf('latte') !== -1) return 'latte';
        if (url.indexOf('chocolate_caliente') !== -1 || url.indexOf('chocolate') !== -1) return 'chocolate';
        if (url.indexOf('croissant') !== -1) return 'croissant';
        if (url.indexOf('dona') !== -1 || url.indexOf('donut') !== -1) return 'donut';
        if (url.indexOf('muffin') !== -1) return 'muffin';
        if (url.indexOf('cupcake') !== -1) return 'cupcake';
        if (url.indexOf('Classic Burger') !== -1 || url.indexOf('classic_burger') !== -1) return 'classic_burger';
        if (url.indexOf('blt_sandwich') !== -1) return 'blt_sandwich';
        if (url.indexOf('sandwich_queso') !== -1 || url.indexOf('ham_cheese') !== -1) return 'ham_cheese';
        if (url.indexOf('ramen') !== -1) return 'ramen';
        if (url.indexOf('burger') !== -1 || url.indexOf('hamburguesa') !== -1) return 'burger';
        if (value === '5') return 'cafe';
        if (value === '6') return 'sushi';
        if (value === '7') return 'pizza';
        if (value === '8') return 'burger';
        if (preset === 'hiro') return 'cafe';
        return null;
      }
      
      function showProduct(key) {
        if (!productPanel) return;
        const p = products[key];
        if (!p) return;
        productTitle.textContent = p.title;
        productPrice.textContent = p.price;
        productIngredients.textContent = p.ingredients;
        productPanel.style.display = 'block';
      }
      
      function hideProduct() {
        if (!productPanel) return;
        productPanel.style.display = 'none';
      }

      // Funcionalidad para tomar captura (Foto)
      document.getElementById('screenshot').addEventListener('click', function() {
        // Efecto de flash
        const flash = document.getElementById('flash-effect');
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 500);

        const scene = document.querySelector('a-scene');
        const video = document.querySelector('video');
        
        // Crear canvas final con el tamaño real del video
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = video.videoWidth;
        finalCanvas.height = video.videoHeight;
        const ctx = finalCanvas.getContext('2d');

        // 1. Dibujar el video de fondo
        ctx.drawImage(video, 0, 0, finalCanvas.width, finalCanvas.height);
        
        // 2. Dibujar la capa de AR (A-Frame)
        scene.renderer.render(scene.object3D, scene.camera);
        ctx.drawImage(scene.canvas, 0, 0, finalCanvas.width, finalCanvas.height);

        // 3. Descargar la captura
        try {
          const dataURL = finalCanvas.toDataURL('image/png');
          const link = document.createElement('a');
          const date = new Date().getTime();
          link.download = `Captura-MenuAR-${date}.png`;
          link.href = dataURL;
          link.click();
        } catch (err) {
          console.error("Error al tomar la captura:", err);
        }
      });
      
      ;(() => {
        const markers = Array.from(document.querySelectorAll('a-marker, a-nft'));
        let activeMarker = null;
        const visibleMarkers = new Set();

        function setActiveMarker(marker) {
          activeMarker = marker;
          markers.forEach(m => {
            // Sólo dejamos visible el marcador activo;
            // los demás se ocultan aunque sigan siendo detectados.
            m.object3D.visible = (m === activeMarker);
          });
          const key = getProductKeyFromMarker(marker);
          if (key) showProduct(key);
        }

        markers.forEach(m => {
          m.addEventListener('markerFound', () => {
            console.log('markerFound', m.getAttribute('url') || m.getAttribute('value') || m.getAttribute('type'));
            visibleMarkers.add(m);
            setActiveMarker(m);
          });

          m.addEventListener('markerLost', () => {
            console.log('markerLost', m.getAttribute('url') || m.getAttribute('value') || m.getAttribute('type'));
            visibleMarkers.delete(m);

            if (activeMarker === m) {
              if (visibleMarkers.size === 0) {
                activeMarker = null;
                hideProduct();
                // Si no hay ningún marcador visible, mostramos todos
                // para la siguiente detección.
                markers.forEach(x => { x.object3D.visible = true; });
              } else {
                const next = Array.from(visibleMarkers)[visibleMarkers.size - 1];
                setActiveMarker(next);
              }
            }
          });
        });
      })();
    </script>

    <script>
      (function () {
        const video = document.getElementById('bg-video');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          const div = document.createElement('div');
          div.className = 'camera-error';
          div.textContent = 'Tu navegador no soporta acceso a cámara (getUserMedia). Prueba con Chrome o Edge.';
          document.body.appendChild(div);
          return;
        }
        navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}})
          .then(stream => {
            video.srcObject = stream;
            console.log('Cámara iniciada para fondo de video.');
          })
          .catch(err => {
            console.error('Error al acceder a la cámara:', err.name, err.message);
            const div = document.createElement('div');
            div.className = 'camera-error';
            div.textContent = 'Error cámara: ' + err.name + ' - ' + err.message + '. Revisa permisos para 127.0.0.1.';
            document.body.appendChild(div);
          });
      })();
    </script>
