<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@v1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script>
      // Componente reutilizable para rotar y escalar modelos 3D con mouse y gestos táctiles.
      // Se aplica a todas las entidades que tengan el atributo `drag-rotate-scale`.
      if (typeof AFRAME !== 'undefined') {
        AFRAME.registerComponent('drag-rotate-scale', {
          schema: {
            minScale: {default: 0.5},
            maxScale: {default: 2.5},
            rotationFactor: {default: 0.4},
            zoomFactor: {default: 0.015}
          },
          init: function () {
            this.isDragging = false;
            this.previousPosition = null;
            this.initialScale = this.el.object3D.scale.x || 1;
            this.scaleFactor = 1;
            this.pinchDistance = null;
            this.onMouseDown = this.handleMouseDown.bind(this);
            this.onMouseMove = this.handleMouseMove.bind(this);
            this.onMouseUp = this.handleMouseUp.bind(this);
            this.onWheel = this.handleWheel.bind(this);
            this.onTouchStart = this.handleTouchStart.bind(this);
            this.onTouchMove = this.handleTouchMove.bind(this);
            this.onTouchEnd = this.handleTouchEnd.bind(this);
            var canvas = this.el.sceneEl.canvas;
            if (canvas) {
              this.addListeners(canvas);
            } else {
              this.el.sceneEl.addEventListener('loaded', () => {
                this.addListeners(this.el.sceneEl.canvas);
              });
            }
          },
          remove: function () {
            var canvas = this.el.sceneEl && this.el.sceneEl.canvas;
            if (canvas) {
              this.removeListeners(canvas);
            }
          },
          addListeners: function (canvas) {
            canvas.addEventListener('mousedown', this.onMouseDown);
            window.addEventListener('mousemove', this.onMouseMove);
            window.addEventListener('mouseup', this.onMouseUp);
            canvas.addEventListener('wheel', this.onWheel, {passive: false});
            canvas.addEventListener('touchstart', this.onTouchStart, {passive: false});
            canvas.addEventListener('touchmove', this.onTouchMove, {passive: false});
            canvas.addEventListener('touchend', this.onTouchEnd);
            canvas.addEventListener('touchcancel', this.onTouchEnd);
          },
          removeListeners: function (canvas) {
            canvas.removeEventListener('mousedown', this.onMouseDown);
            window.removeEventListener('mousemove', this.onMouseMove);
            window.removeEventListener('mouseup', this.onMouseUp);
            canvas.removeEventListener('wheel', this.onWheel);
            canvas.removeEventListener('touchstart', this.onTouchStart);
            canvas.removeEventListener('touchmove', this.onTouchMove);
            canvas.removeEventListener('touchend', this.onTouchEnd);
            canvas.removeEventListener('touchcancel', this.onTouchEnd);
          },
          handleMouseDown: function (evt) {
            this.isDragging = true;
            this.previousPosition = {x: evt.clientX, y: evt.clientY};
          },
          handleMouseMove: function (evt) {
            if (!this.isDragging) return;
            var dx = evt.clientX - this.previousPosition.x;
            this.previousPosition = {x: evt.clientX, y: evt.clientY};
            var rotation = this.el.object3D.rotation;
            rotation.y += dx * this.data.rotationFactor * 0.01;
          },
          handleMouseUp: function () {
            this.isDragging = false;
          },
          handleWheel: function (evt) {
            evt.preventDefault();
            var delta = evt.deltaY;
            var factor = this.scaleFactor - delta * this.data.zoomFactor * 0.01;
            this.setScaleFactor(factor);
          },
          handleTouchStart: function (evt) {
            if (evt.touches.length === 1) {
              this.isDragging = true;
              this.previousPosition = {x: evt.touches[0].clientX, y: evt.touches[0].clientY};
            } else if (evt.touches.length === 2) {
              this.isDragging = false;
              this.pinchDistance = this.getTouchDistance(evt.touches[0], evt.touches[1]);
            }
          },
          handleTouchMove: function (evt) {
            if (evt.touches.length === 1 && this.isDragging) {
              var touch = evt.touches[0];
              var dx = touch.clientX - this.previousPosition.x;
              this.previousPosition = {x: touch.clientX, y: touch.clientY};
              var rotation = this.el.object3D.rotation;
              rotation.y += dx * this.data.rotationFactor * 0.01;
            } else if (evt.touches.length === 2 && this.pinchDistance !== null) {
              var newDistance = this.getTouchDistance(evt.touches[0], evt.touches[1]);
              var ratio = newDistance / this.pinchDistance;
              this.pinchDistance = newDistance;
              var factor = this.scaleFactor * ratio;
              this.setScaleFactor(factor);
            }
          },
          handleTouchEnd: function () {
            this.isDragging = false;
            this.pinchDistance = null;
          },
          getTouchDistance: function (t1, t2) {
            var dx = t1.clientX - t2.clientX;
            var dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
          },
          setScaleFactor: function (factor) {
            var min = this.data.minScale;
            var max = this.data.maxScale;
            this.scaleFactor = Math.min(max, Math.max(min, factor));
            var s = this.initialScale * this.scaleFactor;
            this.el.object3D.scale.set(s, s, s);
          }
        });

        var DISH_MODEL_REGISTRY = {
          sushi: { assetId: '#sushi-model', url: './models/sushi/sushi.glb', scale: '4 4 4', position: '0 -0.9 0', rotation: '0 0 0' },
          sushi_roll: { assetId: '#sushi-rolls-model', url: './models/sushi/sushi_rolls.glb', scale: '3.5 3.5 3.5', position: '0 -1.2 0', rotation: '0 0 0' },
          sushi_salmon: { assetId: '#nigiri-model', url: './models/sushi/salmon_nigiri.glb', scale: '3.5 3.5 3.5', position: '0 -1.2 0', rotation: '0 0 0' },
          ramen: { assetId: '#ramen-model', url: './models/sushi/shrimp_ramen_bowl.glb', scale: '3.5 3.5 3.5', position: '0 -1.2 0', rotation: '0 0 0' },
          pattern_sushi: { assetId: '#sushi-model', url: './models/sushi/sushi.glb', scale: '4 4 4', position: '0 -0.9 0', rotation: '0 0 0' }
        };

        // Platos configurados desde el panel administrativo se guardan en localStorage
        // bajo esta clave. Si existe una coincidencia, se prioriza sobre el registro estático.
        function resolveModelConfig(dishId) {
          if (!dishId) return null;
          return DISH_MODEL_REGISTRY[dishId] || null;
        }

        // Componente que se coloca en cada marcador (a-nft / a-marker) y
        // decide qué modelo 3D cargar cuando el marcador es detectado.
        AFRAME.registerComponent('marker-model', {
          schema: {
            dishId: {type: 'string'}
          },
          init: function () {
            this.modelEntity = this.el.querySelector('[marker-model-host]') || this.el.querySelector('a-entity');
            this.onMarkerFound = this.handleMarkerFound.bind(this);
            this.onModelLoaded = this.handleModelLoaded.bind(this);
            this.onModelError = this.handleModelError.bind(this);
            this.modelInitialized = false;
            this.el.addEventListener('markerFound', this.onMarkerFound);
          },
          remove: function () {
            this.el.removeEventListener('markerFound', this.onMarkerFound);
            if (this.modelEntity) {
              this.modelEntity.removeEventListener('model-loaded', this.onModelLoaded);
              this.modelEntity.removeEventListener('model-error', this.onModelError);
            }
          },
          handleModelLoaded: function () {
            hideModelLoader();
          },
          handleModelError: function () {
            hideModelLoader();
          },
          handleMarkerFound: function () {
            var dishId = this.data.dishId;
            var cfg = resolveModelConfig(dishId);
            if (!cfg) {
              console.warn('No se encontró modelo para marcador', dishId);
              return;
            }
            var host = this.modelEntity || this.el;
            if (!this.modelInitialized) {
              showModelLoader();
              if (cfg.assetId) {
                host.setAttribute('gltf-model', cfg.assetId);
              } else if (cfg.url) {
                host.setAttribute('gltf-model', cfg.url);
              }
              if (this.modelEntity) {
                this.modelEntity.addEventListener('model-loaded', this.onModelLoaded, { once: true });
                this.modelEntity.addEventListener('model-error', this.onModelError, { once: true });
              }
              if (cfg.scale) {
                host.setAttribute('scale', cfg.scale);
              }
              if (cfg.position) {
                host.setAttribute('position', cfg.position);
              }
              if (cfg.rotation) {
                host.setAttribute('rotation', cfg.rotation);
              }
              this.modelInitialized = true;
            }
          }
        });
      }
    </script>
    <style>
      :root {
        --primary-color: #ff4757;
        --secondary-color: #2f3542;
        --accent-color: #ffffff;
      }
      body {
        font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
      }
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: radial-gradient(circle, #2f3542 0%, #000000 100%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        transition: opacity 0.4s ease;
      }
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top: 5px solid var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      #model-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 1500;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #model-loader.visible {
        opacity: 1;
      }
      #model-loader-inner {
        pointer-events: auto;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.8);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #e5e7eb;
      }
      #model-loader-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 2px solid rgba(248, 250, 252, 0.2);
        border-top-color: #f97316;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .ui-container {
        position: absolute;
        bottom: 40px;
        left: 0;
        right: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      .hint-text {
        background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.9));
        color: white;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 13px;
        margin-bottom: 18px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(148, 163, 184, 0.7);
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.8);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 30px;
        pointer-events: auto;
      }
      .screenshot-btn {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 5px solid white;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
        position: relative;
      }
      .screenshot-btn::after {
        content: '';
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 50%;
        transition: all 0.2s;
      }
      .screenshot-btn:active {
        transform: scale(0.9);
      }
      .screenshot-btn:active::after {
        transform: scale(0.8);
        background: var(--primary-color);
      }
      .header-ui {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 1000;
        color: white;
        text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        padding: 8px 14px;
        border-radius: 999px;
        background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.92));
        border: 1px solid rgba(148, 163, 184, 0.8);
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .flash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        z-index: 2000;
        opacity: 0;
        pointer-events: none;
      }
      .flash.active {
        animation: flashAnim 0.5s;
      }
      @keyframes flashAnim {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
      .product-panel {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.7);
        color: #ffffff;
        padding: 14px 18px;
        border-radius: 14px;
        max-width: 280px;
        font-size: 14px;
        backdrop-filter: blur(6px);
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }
      .product-panel.hidden {
        display: none;
      }
      .product-panel.visible {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }
      .product-title {
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 15px;
      }
      .product-price {
        font-weight: 500;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .product-section-title {
        font-size: 12px;
        opacity: 0.9;
        margin-bottom: 2px;
      }
      .product-ingredients {
        font-size: 13px;
        line-height: 1.5;
      }
      .product-reset-btn {
        margin-top: 10px;
        width: 100%;
        padding: 8px 12px;
        border-radius: 999px;
        border: none;
        background: #ff4757;
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .camera-error {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #000;
        color: #fff;
        padding: 10px 16px;
        z-index: 3000;
        font-size: 14px;
      }
      .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 0;
        background: #000;
      }
      .a-canvas {
        background-color: transparent !important;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <div class="flash" id="flash-effect"></div>

    <div id="model-loader">
      <div id="model-loader-inner">
        <div id="model-loader-dot"></div>
        <span>Cargando modelo 3D del plato...</span>
      </div>
    </div>

    <div class="header-ui">
      <span>Menú AR</span>
    </div>

    <div class="arjs-loader" id="global-loader">
      <div class="loader-spinner"></div>
      <div>Detectando cámara y preparando la experiencia de menú en Realidad Aumentada...</div>
    </div>

    <div class="product-panel hidden" id="product-panel">
      <div class="product-title" id="product-title"></div>
      <div class="product-price" id="product-price"></div>
      <div class="product-section-title">Ingredientes</div>
      <div class="product-ingredients" id="product-ingredients"></div>
      <button class="product-reset-btn" id="product-reset-btn">Escanear otro plato</button>
    </div>

    <div class="ui-container">
      <div class="hint-text">
        <span>📷</span>
        <span>Apunta al código QR de la mesa o a la imagen del menú para ver el plato.</span>
      </div>
      <div class="controls">
        <div class="screenshot-btn" id="screenshot"></div>
      </div>
    </div>

    <!-- Escena principal de WebAR por imagen (AR.js + A-Frame).
         Optimizada para móviles manteniendo buena calidad de cámara. -->
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      loading-screen="enabled: false"
      renderer="antialias: false; colorManagement: true; alpha: true; precision: mediump;"
      arjs="sourceType: webcam; sourceWidth: 480; sourceHeight: 360; displayWidth: 640; displayHeight: 480; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
      screenshot
      style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;">
      
      <a-assets>
        <a-asset-item id="sushi-model" src="./models/sushi/sushi.glb"></a-asset-item>
        <a-asset-item id="sushi-rolls-model" src="./models/sushi/sushi_rolls.glb"></a-asset-item>
        <a-asset-item id="nigiri-model" src="./models/sushi/salmon_nigiri.glb"></a-asset-item>
        <a-asset-item id="ramen-model" src="./models/sushi/shrimp_ramen_bowl.glb"></a-asset-item>
      </a-assets>

      <!-- Marcadores NFT para platos de sushi -->
      <a-nft type="nft" url="./markers/sushi" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2" marker-model="dishId: sushi">
        <a-entity
          gltf-model="#sushi-model"
          scale="6 6 6"
          position="0 -1.2 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-nft>

      <a-nft type="nft" url="./markers/sushi_roll/sushi_roll" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2" marker-model="dishId: sushi_roll" data-lite="extra">
        <a-entity
          gltf-model="#sushi-rolls-model"
          scale="4 4 4"
          position="0 -1.2 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-nft>

      <a-nft type="nft" url="./markers/sushi_salmon/sushi_salmon" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2" marker-model="dishId: sushi_salmon" data-lite="extra">
        <a-entity
          gltf-model="#nigiri-model"
          scale="4 4 4"
          position="0 -1.2 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-nft>

      <a-nft type="nft" url="./markers/ramen/ramen" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2" marker-model="dishId: ramen" data-lite="extra">
        <a-entity
          gltf-model="#ramen-model"
          scale="4 4 4"
          position="0 -1.2 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-nft>
      
      <!-- Marcador pattern para sushi -->
      <a-marker type="pattern" url="./pattern-sushi.patt" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2" marker-model="dishId: pattern_sushi" data-lite="extra">
        <a-entity
          gltf-model="#sushi-model"
          scale="6 6 6"
          position="0 -1.2 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-marker>

      <!-- Marcadores barcode para platos de sushi -->
      <a-marker type="barcode" value="6" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2">
        <a-entity
          gltf-model="#sushi-model"
          scale="4 4 4"
          position="0 -0.9 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="17" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2">
        <a-entity
          gltf-model="#sushi-rolls-model"
          scale="4 4 4"
          position="0 -1.2 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="18" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2">
        <a-entity
          gltf-model="#nigiri-model"
          scale="4 4 4"
          position="0 -1.2 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="19" emitevents="true" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="2">
        <a-entity
          gltf-model="#ramen-model"
          scale="4 4 4"
          position="0 -1.2 0"
          rotation="0 0 0"
          drag-rotate-scale="minScale: 0.5; maxScale: 2; rotationFactor: 0.5">
        </a-entity>
      </a-marker>

      <a-entity light="type: ambient; color: #FFF; intensity: 1.2"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-1 1 1"></a-entity>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      var DISH_DATA_JSON = {};

      function getQueryParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      function isMobileDevice() {
        var ua = navigator.userAgent || '';
        return /Android|iPhone|iPad|iPod/i.test(ua);
      }

      function hasLowMemory() {
        return typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4;
      }

      function isLiteMode() {
        var modeParam = getQueryParam('mode');
        if (modeParam === 'full') return false;
        if (modeParam === 'lite') return true;
        if (isMobileDevice()) return true;
        return hasLowMemory();
      }

      function loadPlatosJson() {
        return fetch('data/platos.json')
          .then(function (res) { return res.json(); })
          .then(function (json) {
            var index = {};
            (json.platos || []).forEach(function (p) {
              index[p.id] = p;
            });
            DISH_DATA_JSON = index;
            return json.platos || [];
          })
          .catch(function () { return []; });
      }

      function createDynamicNftMarkers(platos) {
        var scene = document.querySelector('a-scene');
        if (!scene) return;
        platos.forEach(function (plato) {
          if (!plato.nftPath || !plato.modelPath || !plato.id) return;
          var marker = document.createElement('a-nft');
          marker.setAttribute('type', 'nft');
          marker.setAttribute('url', plato.nftPath);
          marker.setAttribute('emitevents', 'true');
          marker.setAttribute('smooth', 'true');
          marker.setAttribute('smoothCount', '4');
          marker.setAttribute('smoothTolerance', '0.02');
          marker.setAttribute('smoothThreshold', '2');
          marker.setAttribute('marker-model', 'dishId: ' + plato.id);
          var entity = document.createElement('a-entity');
          entity.setAttribute('gltf-model', plato.modelPath);
          entity.setAttribute('scale', plato.scale || '1 1 1');
          entity.setAttribute('position', plato.position || '0 0 0');
          entity.setAttribute('rotation', plato.rotation || '0 0 0');
          entity.setAttribute('drag-rotate-scale', 'minScale: 0.5; maxScale: 2; rotationFactor: 0.5');
          marker.appendChild(entity);
          scene.appendChild(marker);
        });
      }

      function preloadKeyDishModels() {
        var scene = document.querySelector('a-scene');
        if (!scene) return;
        Object.keys(DISH_MODEL_REGISTRY).forEach(function (id) {
          var cfg = DISH_MODEL_REGISTRY[id];
          if (!cfg) return;
          var temp = document.createElement('a-entity');
          temp.setAttribute('visible', 'false');
          if (cfg.assetId) {
            temp.setAttribute('gltf-model', cfg.assetId);
          } else if (cfg.url) {
            temp.setAttribute('gltf-model', cfg.url);
          }
          temp.addEventListener('model-loaded', function () {
            if (scene.contains(temp)) {
              scene.removeChild(temp);
            }
          });
          scene.appendChild(temp);
        });
      }

      window.addEventListener('load', function () {
        if (isLiteMode()) {
          var heavyMarkers = document.querySelectorAll('a-nft[data-lite="extra"], a-marker[data-lite="extra"]');
          heavyMarkers.forEach(function (m) {
            if (m.parentNode) {
              m.parentNode.removeChild(m);
            }
          });
        }
        preloadKeyDishModels();
        loadPlatosJson().then(createDynamicNftMarkers);
      });

      // Panel de información del plato asociado al marcador actualmente visible.
      const productPanel = document.getElementById('product-panel');
      const productTitle = document.getElementById('product-title');
      const productPrice = document.getElementById('product-price');
      const productIngredients = document.getElementById('product-ingredients');
      const globalLoader = document.getElementById('global-loader');
      const modelLoader = document.getElementById('model-loader');
      const productResetBtn = document.getElementById('product-reset-btn');
      
      // PRECIOS CORREGIDOS según las imágenes
      // Mapa base de platos para la demo del restaurante.
      // Cada entrada se asocia a un marcador mediante getProductKeyFromMarker.
      const products = {
        sushi: {
          title: 'Makis New Styles (10 pzs)',
          price: 'S/ 25.00',
          ingredients: 'Variedades como Amazon, Anticuchero, Banzai, Kaminaki, Parrillero, Pulpo al Olivo y Jalea.'
        },
        sushi_rolls: {
          title: 'Volcano Roll (5 pzs)',
          price: 'S/ 19.00',
          ingredients: 'Roll tipo Volcano de la sección 5 piezas del menú Zelva Nikkei.'
        },
        nigiri: {
          title: 'Nigiris especiales (2 bocados)',
          price: 'S/ 15.00',
          ingredients: 'Inca Nigiri, Misoyaki, Pasión, Coco Beach y Hotate Spicy.'
        },
        ramen: {
          title: 'Zelva Ramen',
          price: 'S/ 32.00',
          ingredients: 'Caldo caliente con fideos y topping nikkei, ideal para el frío.'
        }
      };

      // Relación opcional entre ids de modelos GLB y sus imágenes de referencia 2D.
      const modelImages = {
        'sushi-model': 'img/sushi/sushi.png',
        'sushi-rolls-model': 'img/sushi/sushi_roll.png',
        'nigiri-model': 'img/sushi/sushi_salmon.png',
        'ramen-model': 'img/sushi/ramen.png'
      };
      
      const adminStorageKey = 'adminPlatosAR';
      
      function showModelLoader() {
        if (!modelLoader) return;
        modelLoader.classList.add('visible');
      }
      
      function hideModelLoader() {
        if (!modelLoader) return;
        modelLoader.classList.remove('visible');
      }
      
      // Integra dinámicamente en la escena los platos que se hayan creado
      // desde el panel administrativo (menu-visual.html) utilizando localStorage.
      (function integrateAdminDishes() {
        let raw;
        try {
          raw = localStorage.getItem(adminStorageKey);
        } catch (e) {
          return;
        }
        if (!raw) return;
        let platos;
        try {
          platos = JSON.parse(raw);
        } catch (e) {
          return;
        }
        if (!Array.isArray(platos)) return;
        const scene = document.querySelector('a-scene');
        if (!scene) return;
        const assets = scene.querySelector('a-assets');
        if (!assets) return;
        platos.forEach(function(p) {
          if (!p || !p.marcador || !p.modelo || !p.imagen || !p.nombre || !p.precio || !p.descripcion || !p.tipo) {
            return;
          }
          const modelId = 'admin-model-' + p.marcador;
          if (!assets.querySelector('#' + modelId)) {
            const asset = document.createElement('a-asset-item');
            asset.setAttribute('id', modelId);
            let src = p.modelo;
            if (src.indexOf('./') !== 0) {
              src = './' + src.replace(/^\/+/, '');
            }
            asset.setAttribute('src', src);
            assets.appendChild(asset);
          }
          const productsKey = p.marcador;
          if (!products[productsKey]) {
            products[productsKey] = {
              title: p.nombre,
              price: 'S/ ' + p.precio,
              ingredients: p.descripcion
            };
          }
          if (!modelImages[modelId]) {
            modelImages[modelId] = p.imagen;
          }
          const tipo = p.tipo;
          const folder = 'sushi';
          const markerUrl = "./zip´s/" + folder + "/" + p.marcador;
          const nft = document.createElement('a-nft');
          nft.setAttribute('type', 'nft');
          nft.setAttribute('url', markerUrl);
          nft.setAttribute('emitevents', 'true');
          nft.setAttribute('smooth', 'true');
          nft.setAttribute('smoothCount', '20');
          nft.setAttribute('smoothTolerance', '0.002');
          nft.setAttribute('smoothThreshold', '2');
          nft.setAttribute('data-product-key', productsKey);
          const entity = document.createElement('a-entity');
          const baseModelId = '#' + modelId;
          let scale = '4 4 4';
          entity.setAttribute('gltf-model', baseModelId);
          entity.setAttribute('scale', scale);
          entity.setAttribute('position', '0 -1.2 0');
          entity.setAttribute('rotation', '0 0 0');
          entity.setAttribute('drag-rotate-scale', 'minScale: 0.5; maxScale: 2; rotationFactor: 0.5');
          nft.appendChild(entity);
          scene.appendChild(nft);
        });
      })();
      
      // A partir del marcador detectado (NFT, patrón .patt o código de barras),
      // intenta deducir qué clave de producto mostrar en el panel lateral.
      function getProductKeyFromMarker(marker) {
        const custom = marker.getAttribute('data-product-key');
        if (custom) return custom;
        const url = marker.getAttribute('url') || '';
        const value = marker.getAttribute('value');
        if (url.indexOf('sushi_roll') !== -1 || url.indexOf('sushi_rolls') !== -1) return 'sushi_rolls';
        if (url.indexOf('sushi_salmon') !== -1 || url.indexOf('nigiri') !== -1) return 'nigiri';
        if (url.indexOf('ramen') !== -1) return 'ramen';
        if (url.indexOf('sushi') !== -1) return 'sushi';
        if (value === '6') return 'sushi';
        if (value === '17') return 'sushi_rolls';
        if (value === '18') return 'nigiri';
        if (value === '19') return 'ramen';
        return null;
      }
      
      function hideGlobalLoader() {
        if (!globalLoader) return;
        globalLoader.style.opacity = '0';
        globalLoader.style.pointerEvents = 'none';
        setTimeout(function () {
          if (globalLoader && globalLoader.style) {
            globalLoader.style.display = 'none';
          }
        }, 400);
      }

      const sceneEl = document.querySelector('a-scene');
      if (sceneEl && globalLoader) {
        sceneEl.addEventListener('loaded', hideGlobalLoader);
      }

      function showProduct(key) {
        if (!productPanel) return;
        const p = products[key];
        if (!p) return;
        productTitle.textContent = p.title;
        productPrice.textContent = p.price;
        productIngredients.textContent = p.ingredients;
        productPanel.classList.remove('hidden');
        productPanel.classList.add('visible');
      }
      
      function hideProduct() {
        if (!productPanel) return;
        productPanel.classList.remove('visible');
        productPanel.classList.add('hidden');
      }

      if (productResetBtn) {
        productResetBtn.addEventListener('click', function () {
          if (typeof window.resetARTracking === 'function') {
            window.resetARTracking();
          }
        });
      }

      // Funcionalidad para tomar captura (Foto)
      document.getElementById('screenshot').addEventListener('click', function() {
        // Efecto de flash
        const flash = document.getElementById('flash-effect');
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 500);

        const scene = document.querySelector('a-scene');
        const video = document.querySelector('video');
        
        // Crear canvas final con el tamaño real del video
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = video.videoWidth;
        finalCanvas.height = video.videoHeight;
        const ctx = finalCanvas.getContext('2d');

        // 1. Dibujar el video de fondo
        ctx.drawImage(video, 0, 0, finalCanvas.width, finalCanvas.height);
        
        // 2. Dibujar la capa de AR (A-Frame)
        scene.renderer.render(scene.object3D, scene.camera);
        ctx.drawImage(scene.canvas, 0, 0, finalCanvas.width, finalCanvas.height);

        // 3. Descargar la captura
        try {
          const dataURL = finalCanvas.toDataURL('image/png');
          const link = document.createElement('a');
          const date = new Date().getTime();
          link.download = `Captura-MenuAR-${date}.png`;
          link.href = dataURL;
          link.click();
        } catch (err) {
          console.error("Error al tomar la captura:", err);
        }
      });
      
      ;(() => {
        const markers = Array.from(document.querySelectorAll('a-marker, a-nft'));
        let activeMarker = null;
        const visibleMarkers = new Set();
        let trackingFrozen = false;

        function setActiveMarker(marker) {
          activeMarker = marker;
          markers.forEach(m => {
            m.object3D.visible = (m === activeMarker);
          });
          const key = getProductKeyFromMarker(marker);
          if (key) showProduct(key);
        }

        markers.forEach(m => {
          m.addEventListener('markerFound', () => {
            if (trackingFrozen && activeMarker) {
              return;
            }
            console.log('markerFound', m.getAttribute('url') || m.getAttribute('value') || m.getAttribute('type'));
            visibleMarkers.add(m);
            if (!activeMarker) {
              setActiveMarker(m);
              if (isLiteMode()) {
                trackingFrozen = true;
              }
            }
            hideGlobalLoader();
          });

          m.addEventListener('markerLost', () => {
            if (trackingFrozen) {
              return;
            }
            console.log('markerLost', m.getAttribute('url') || m.getAttribute('value') || m.getAttribute('type'));
            visibleMarkers.delete(m);

            if (activeMarker === m) {
              if (visibleMarkers.size === 0) {
                activeMarker = null;
                hideProduct();
                markers.forEach(x => { x.object3D.visible = true; });
              } else {
                const next = Array.from(visibleMarkers)[visibleMarkers.size - 1];
                setActiveMarker(next);
              }
            }
          });
        });

        window.resetARTracking = function () {
          trackingFrozen = false;
          activeMarker = null;
          visibleMarkers.clear();
          hideProduct();
          markers.forEach(function (x) {
            x.object3D.visible = true;
          });
        };
      })();
    </script>

  </body>
</html>
