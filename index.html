<!DOCTYPE html>
<html>
  <head>
    <title>WebAR - Escáner de Códigos de Barras v3 (No Text)</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js for Barcode/Marker Tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      .capture-button {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 60px;
        background-color: rgba(255, 255, 255, 0.8);
        border: 4px solid white;
        border-radius: 50%;
        z-index: 1000;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      
      .capture-button:active {
        background-color: white;
        transform: translateX(-50%) scale(0.95);
      }

      .capture-icon {
        width: 24px;
        height: 24px;
        background-color: #333;
        border-radius: 50%;
      }

      /* Info Panel Styles */
      .info-panel {
        position: fixed;
        bottom: 110px; /* Above capture button */
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 400px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 15px;
        z-index: 900;
        display: none; /* Hidden by default */
        text-align: center;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: opacity 0.3s ease;
      }

      .info-panel h2 {
        margin: 0 0 5px 0;
        font-size: 1.2rem;
        color: #ff9800; /* Orange accent */
      }

      .info-panel p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
        color: #ddd;
      }

      .info-panel .price {
        display: block;
        margin-top: 8px;
        font-weight: bold;
        font-size: 1.1rem;
        color: #4caf50; /* Green for price */
      }

      /* Flash Effect Overlay */
      #flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        opacity: 0;
        z-index: 2000;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
      }
      .flash-active {
        opacity: 0.8 !important;
      }
    </style>
  </head>
  <body>
    <!-- Flash Overlay -->
    <div id="flash-overlay"></div>

    <!-- Capture Button -->
    <div class="capture-button" id="capture-btn">
      <div class="capture-icon"></div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="info-panel">
      <h2 id="panel-title">Nombre del Plato</h2>
      <p id="panel-desc">Descripción del plato aquí.</p>
      <span class="price" id="panel-price">S/ 0.00</span>
      <p style="font-size: 0.7rem; color: #aaa; margin-top: 5px;">(Pellizca para escalar)</p>
    </div>
    
    <!-- Hidden Debug Element to prevent JS errors -->
    <div id="debug-text" style="display: none;"></div>

    <!-- AR.js Scene Setup for 3x3 Barcodes -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; smoothing: true; smoothingAmount: 0.5;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true; precision: medium; preserveDrawingBuffer: true;"
      vr-mode-ui="enabled: false"
      gesture-detector>

      <script>
        // Component to handle pinch gestures for scaling
        AFRAME.registerComponent('gesture-detector', {
          schema: {
            element: { default: '' }
          },
          init: function() {
            this.targetElement = this.data.element && document.querySelector(this.data.element);
            if (!this.targetElement) {
              this.targetElement = this.el;
            }
            this.internalState = {
              previousState: null
            };
            this.emitGestureEvent = this.emitGestureEvent.bind(this);
            this.targetElement.addEventListener("touchstart", this.emitGestureEvent);
            this.targetElement.addEventListener("touchend", this.emitGestureEvent);
            this.targetElement.addEventListener("touchmove", this.emitGestureEvent);
          },
          remove: function() {
            this.targetElement.removeEventListener("touchstart", this.emitGestureEvent);
            this.targetElement.removeEventListener("touchend", this.emitGestureEvent);
            this.targetElement.removeEventListener("touchmove", this.emitGestureEvent);
          },
          emitGestureEvent: function(event) {
            const currentState = this.getTouchState(event);
            const previousState = this.internalState.previousState;
            const gestureContinues = previousState && currentState && currentState.touchCount == previousState.touchCount;
            const gestureEnded = previousState && !gestureContinues;
            const gestureStarted = currentState && !gestureContinues;

            if (gestureEnded) {
              const eventName = this.getEventPrefix(previousState.touchCount) + "fingerend";
              this.el.emit(eventName, previousState);
              this.internalState.previousState = null;
            }
            if (gestureStarted) {
              currentState.startTime = performance.now();
              currentState.startPosition = currentState.position;
              currentState.startSpread = currentState.spread;
              const eventName = this.getEventPrefix(currentState.touchCount) + "fingerstart";
              this.el.emit(eventName, currentState);
              this.internalState.previousState = currentState;
            }
            if (gestureContinues) {
              const eventDetail = {
                positionChange: {
                  x: currentState.position.x - previousState.position.x,
                  y: currentState.position.y - previousState.position.y
                },
                spreadChange: currentState.spread - previousState.spread,
                spread: currentState.spread, // Add absolute spread value
                startSpread: currentState.startSpread,
                originalEvent: event
              };
              const eventName = this.getEventPrefix(currentState.touchCount) + "fingermove";
              this.el.emit(eventName, eventDetail);
              this.internalState.previousState = currentState;
            }
          },
          getTouchState: function(event) {
            if (event.touches.length === 0) {
              return null;
            }
            const touchList = [];
            for (let i = 0; i < event.touches.length; i++) {
              touchList.push(event.touches[i]);
            }
            const touchState = {
              touchCount: touchList.length
            };
            const centerPositionRawX = touchList.reduce((sum, touch) => sum + touch.clientX, 0) / touchList.length;
            const centerPositionRawY = touchList.reduce((sum, touch) => sum + touch.clientY, 0) / touchList.length;
            touchState.position = {
              x: centerPositionRawX,
              y: centerPositionRawY
            };
            if (touchList.length >= 2) {
              const spread = Math.abs(touchList[0].clientX - touchList[1].clientX) + Math.abs(touchList[0].clientY - touchList[1].clientY);
              touchState.spread = spread;
            }
            return touchState;
          },
          getEventPrefix: function(touchCount) {
            const numberNames = ["one", "two", "three", "many"];
            return numberNames[Math.min(touchCount, 4) - 1];
          }
        });

        AFRAME.registerComponent('pinch-scale', {
          schema: {
            min: { default: 0.2 },
            max: { default: 4 }
          },
          init: function() {
            this.initialScale = this.el.object3D.scale.clone();
            this.scaleFactor = 1;
            this.baseScaleFactor = 1; // Scale factor at start of gesture
            
            this.handleEvent = this.handleEvent.bind(this);
            this.handleStart = this.handleStart.bind(this);
            
            this.el.sceneEl.addEventListener("twofingermove", this.handleEvent);
            this.el.sceneEl.addEventListener("twofingerstart", this.handleStart);
          },
          remove: function() {
            this.el.sceneEl.removeEventListener("twofingermove", this.handleEvent);
            this.el.sceneEl.removeEventListener("twofingerstart", this.handleStart);
          },
          handleStart: function(event) {
             // On gesture start, save the current scale factor as base
             this.baseScaleFactor = this.scaleFactor;
          },
          handleEvent: function(event) {
            // Only scale if this entity is visible (active marker)
            if (this.el.getAttribute('visible') === false) return;
            if (!event.detail.spread || !event.detail.startSpread) return;

            // Calculate new scale factor based on spread ratio (Linear Zoom)
            // currentSpread / startSpread gives the ratio of change for THIS gesture
            const spreadRatio = event.detail.spread / event.detail.startSpread;
            
            // Apply to the base factor from when gesture started
            this.scaleFactor = this.baseScaleFactor * spreadRatio;
            
            // Clamp
            this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.min), this.data.max);

            this.el.object3D.scale.x = this.initialScale.x * this.scaleFactor;
            this.el.object3D.scale.y = this.initialScale.y * this.scaleFactor;
            this.el.object3D.scale.z = this.initialScale.z * this.scaleFactor;
          }
        });
      </script>

      <a-assets>
        <a-asset-item id="ramen-model" src="models/sushi/shrimp_ramen_bowl.glb"></a-asset-item>
        <a-asset-item id="roll-model" src="models/sushi/sushi_rolls.glb?v=2"></a-asset-item>
        <a-asset-item id="salmon-model" src="models/sushi/salmon_nigiri.glb"></a-asset-item>
        <a-asset-item id="sushi-model" src="models/sushi/sushi.glb"></a-asset-item>
      </a-assets>

      <!-- Lighting to ensure models are visible -->
      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="directional" position="0 1 0" intensity="1.5" target="#directionaltarget">
        <a-entity id="directionaltarget" position="0 0 0"></a-entity>
      </a-light>

      <!-- Marker 0: Ramen -->
      <a-marker type="barcode" value="0" id="marker-0">
        <!-- Full 3D Model (Active) -->
        <a-entity id="content-0" visible="false" pinch-scale>
            <a-entity 
              gltf-model="#ramen-model" 
              scale="3.0 3.0 3.0" 
              rotation="0 0 0"
              position="0 0 0">
            </a-entity>
        </a-entity>
        <!-- Placeholder/Target (Inactive) -->
        <a-entity id="placeholder-0" visible="false" class="clickable" data-id="0">
            <a-ring color="#FFD700" radius-inner="0.4" radius-outer="0.6" rotation="-90 0 0" opacity="0.8"
                    animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true">
            </a-ring>
            <!-- Invisible Hitbox -->
            <a-circle color="#FFF" opacity="0.01" radius="0.8" rotation="-90 0 0"></a-circle>
        </a-entity>
      </a-marker>

      <!-- Marker 1: Roll -->
      <a-marker type="barcode" value="1" id="marker-1">
        <a-entity id="content-1" visible="false" pinch-scale>
            <a-entity 
              gltf-model="#roll-model" 
              scale="8.0 8.0 8.0" 
              rotation="0 0 0"
              position="0 0 0">
            </a-entity>
        </a-entity>
        <a-entity id="placeholder-1" visible="false" class="clickable" data-id="1">
            <a-ring color="#FFD700" radius-inner="0.4" radius-outer="0.6" rotation="-90 0 0" opacity="0.8"
                    animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true">
            </a-ring>
            <a-circle color="#FFF" opacity="0.01" radius="0.8" rotation="-90 0 0"></a-circle>
        </a-entity>
      </a-marker>

      <!-- Marker 2: Salmon (Nigiri) -->
      <a-marker type="barcode" value="2" id="marker-2">
        <a-entity id="content-2" visible="false" pinch-scale>
            <a-entity 
              gltf-model="#salmon-model" 
              scale="0.5 0.5 0.5" 
              rotation="0 0 0"
              position="0 0 0">
            </a-entity>
        </a-entity>
        <a-entity id="placeholder-2" visible="false" class="clickable" data-id="2">
            <a-ring color="#FFD700" radius-inner="0.4" radius-outer="0.6" rotation="-90 0 0" opacity="0.8"
                    animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true">
            </a-ring>
            <a-circle color="#FFF" opacity="0.01" radius="0.8" rotation="-90 0 0"></a-circle>
        </a-entity>
      </a-marker>

      <!-- Marker 3: Sushi (Makis) -->
      <a-marker type="barcode" value="3" id="marker-3">
        <a-entity id="content-3" visible="false" pinch-scale>
            <a-entity 
              gltf-model="#sushi-model" 
              scale="8.0 8.0 8.0" 
              rotation="0 0 0"
              position="0 0 0">
            </a-entity>
        </a-entity>
        <a-entity id="placeholder-3" visible="false" class="clickable" data-id="3">
            <a-ring color="#FFD700" radius-inner="0.4" radius-outer="0.6" rotation="-90 0 0" opacity="0.8"
                    animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true">
            </a-ring>
            <a-circle color="#FFF" opacity="0.01" radius="0.8" rotation="-90 0 0"></a-circle>
        </a-entity>
      </a-marker>

      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable" near="0.01" far="10000"></a-entity>
    </a-scene>

    <script>
      const debugText = document.getElementById('debug-text');
      const captureBtn = document.getElementById('capture-btn');
      const infoPanel = document.getElementById('info-panel');
      const panelTitle = document.getElementById('panel-title');
      const panelDesc = document.getElementById('panel-desc');
      const panelPrice = document.getElementById('panel-price');
      const flashOverlay = document.getElementById('flash-overlay');

      let activeMarkerId = null;
      const visibleMarkers = new Set(); // Track which markers are currently detected

      // Dish Data
      const dishes = {
        0: {
          name: "Zelva Ramen",
          desc: "Ramen de la casa, ideal para el frío y para experiencias AR inmersivas.",
          price: "S/ 32.00"
        },
        1: {
          name: "Volcano Roll",
          desc: "Delicioso rollo con salsa volcánica y relleno especial.",
          price: "S/ 25.00"
        },
        2: {
          name: "Nigiris Especiales",
          desc: "Selección de nigiris con salmón fresco y toques cítricos.",
          price: "S/ 15.00"
        },
        3: {
          name: "Makis New Styles",
          desc: "Makis New Styles de Zelva Nikkei (Amazon, Anticuchero, Banzai, Kaminaki, Parrillero, Pulpo al Olivo, Jalea).",
          price: "S/ 25.00"
        }
      };

      const scene = document.querySelector('a-scene');

      scene.addEventListener('loaded', () => {
        debugText.innerText = "Cámara lista. Apunta a un código.";
        console.log("Scene loaded");
      });

      // Capture Button Logic
      captureBtn.addEventListener('click', () => {
        // Visual Feedback (Flash) - Trigger immediately
        flashOverlay.classList.add('flash-active');
        setTimeout(() => {
          flashOverlay.classList.remove('flash-active');
        }, 150);

        // 1. Setup Capture Canvas (Match Viewport)
        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = window.innerWidth;
        captureCanvas.height = window.innerHeight;
        const ctx = captureCanvas.getContext('2d');

        // 2. Draw Video (Camera Feed) - Correctly Scaled (Cover)
        const video = document.querySelector('video');
        if (video) {
          const vRatio = video.videoWidth / video.videoHeight;
          const cRatio = captureCanvas.width / captureCanvas.height;
          let sWidth, sHeight, sx, sy;

          // Object-fit: cover logic
          if (cRatio > vRatio) {
            sWidth = video.videoWidth;
            sHeight = video.videoWidth / cRatio;
            sx = 0;
            sy = (video.videoHeight - sHeight) / 2;
          } else {
            sWidth = video.videoHeight * cRatio;
            sHeight = video.videoHeight;
            sx = (video.videoWidth - sWidth) / 2;
            sy = 0;
          }
          
          ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, captureCanvas.width, captureCanvas.height);
        }

        // 3. Draw WebGL Scene (Models)
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.canvas) {
          // FORCE RENDER to ensure model is in buffer
          sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
          
          const glCanvas = sceneEl.canvas;
          ctx.drawImage(glCanvas, 0, 0, captureCanvas.width, captureCanvas.height);
        }

        // 5. Download
        const link = document.createElement('a');
        link.download = `web-ar-capture-${Date.now()}.png`;
        link.href = captureCanvas.toDataURL('image/png');
        link.click();
      });

      // Component to make entities face the camera (Billboard)
      AFRAME.registerComponent('billboard', {
        tick: function() {
          const camera = this.el.sceneEl.camera;
          if (!camera) return;
          this.el.object3D.lookAt(camera.el.object3D.position);
        }
      });

      // Helper: Update state of all markers based on activeMarkerId and visibleMarkers
      function updateState() {
        // If nothing is visible, hide panel and return
        if (visibleMarkers.size === 0) {
            infoPanel.style.display = 'none';
            // We do NOT clear activeMarkerId here anymore, so it "remembers" the last selection
            // activeMarkerId = null; 
            debugText.innerText = "Buscando códigos...";
            return;
        }

        // AUTO-SWITCH REMOVED: We only switch if activeMarkerId is null (first detection)
        // or if the user explicitly clicks another marker.
        
        // If no marker is currently selected, pick the first visible one
        if (activeMarkerId === null && visibleMarkers.size > 0) {
            activeMarkerId = visibleMarkers.values().next().value;
        }

        // Apply Visibility Logic
        [0, 1, 2, 3].forEach(id => {
            const content = document.getElementById('content-' + id);
            const placeholder = document.getElementById('placeholder-' + id);
            
            if (!visibleMarkers.has(id)) {
                // Not detected: Hide everything
                content.setAttribute('visible', 'false');
                placeholder.setAttribute('visible', 'false');
            } else if (id === activeMarkerId) {
                // Active: Show Content, Hide Placeholder
                content.setAttribute('visible', 'true');
                placeholder.setAttribute('visible', 'false');
                
                // Update Panel
                if (dishes[id]) {
                    panelTitle.innerText = dishes[id].name;
                    panelDesc.innerText = dishes[id].desc;
                    panelPrice.innerText = dishes[id].price;
                    infoPanel.style.display = 'block';
                    debugText.innerText = `Plato: ${dishes[id].name}`;
                }
            } else {
                // Inactive but Detected: Show Placeholder, Hide Content
                content.setAttribute('visible', 'false');
                placeholder.setAttribute('visible', 'true');
            }
        });
      }

      // Handle marker detection
      const lostTimeouts = {}; // Store timeouts for debounce

      [0, 1, 2, 3].forEach(id => {
        const marker = document.getElementById('marker-' + id);
        const placeholder = document.getElementById('placeholder-' + id);
        
        marker.addEventListener('markerFound', () => {
          // Clear any pending lost event for this marker
          if (lostTimeouts[id]) {
            clearTimeout(lostTimeouts[id]);
            delete lostTimeouts[id];
          }
          
          visibleMarkers.add(id);
          updateState();
        });

        marker.addEventListener('markerLost', () => {
          // Debounce: Wait 500ms before actually declaring it lost
          // This prevents flickering if the hand shakes briefly
          lostTimeouts[id] = setTimeout(() => {
            visibleMarkers.delete(id);
            updateState();
            delete lostTimeouts[id];
          }, 500);
        });

        // Click on Placeholder: Make this marker active
        placeholder.addEventListener('click', (evt) => {
            evt.stopPropagation(); // Prevent bubbling
            activeMarkerId = id;
            updateState();
            console.log("Switched to marker", id);
        });
        
        // Also allow clicking the active content to refresh panel (optional)
        const content = document.getElementById('content-' + id);
        content.addEventListener('click', (evt) => {
            evt.stopPropagation();
        });
      });
    </script>
  </body>
</html>
