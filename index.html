<!DOCTYPE html>
<html>
  <head>
    <title>WebAR - Escáner de Códigos de Barras</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js for Barcode/Marker Tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      .capture-button {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 60px;
        background-color: rgba(255, 255, 255, 0.8);
        border: 4px solid white;
        border-radius: 50%;
        z-index: 1000;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      
      .capture-button:active {
        background-color: white;
        transform: translateX(-50%) scale(0.95);
      }

      .capture-icon {
        width: 24px;
        height: 24px;
        background-color: #333;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <!-- Capture Button -->
    <div class="capture-button" id="capture-btn">
      <div class="capture-icon"></div>
    </div>
    
    <!-- Hidden Debug Element to prevent JS errors -->
    <div id="debug-text" style="display: none;"></div>

    <!-- AR.js Scene Setup for 3x3 Barcodes -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true; precision: medium; preserveDrawingBuffer: true;"
      vr-mode-ui="enabled: false">

      <a-assets>
        <a-asset-item id="ramen-model" src="models/sushi/shrimp_ramen_bowl.glb"></a-asset-item>
        <a-asset-item id="roll-model" src="models/sushi/sushi_rolls.glb?v=2"></a-asset-item>
        <a-asset-item id="salmon-model" src="models/sushi/salmon_nigiri.glb"></a-asset-item>
        <a-asset-item id="sushi-model" src="models/sushi/sushi.glb"></a-asset-item>
      </a-assets>

      <!-- MARKER 0: RAMEN -->
      <a-marker type="barcode" value="0" id="marker-0">
        <a-entity id="content-0" visible="false">
          <a-entity 
            gltf-model="#ramen-model" 
            scale="0.6 0.6 0.6" 
            rotation="-90 0 0"
            position="0 0 0">
          </a-entity>
          <a-text value="Zelva Ramen" position="0 0 0.8" rotation="-90 0 0" align="center" color="#FFF" scale="2 2 2"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 1: SUSHI ROLL -->
      <a-marker type="barcode" value="1" id="marker-1">
        <a-entity id="content-1" visible="false">
          <a-entity 
            gltf-model="#roll-model" 
            scale="0.6 0.6 0.6" 
            rotation="-90 0 0"
            position="0 0 0">
          </a-entity>
          <a-text value="Volcano Roll" position="0 0 0.8" rotation="-90 0 0" align="center" color="#FFF" scale="2 2 2"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 2: SALMON -->
      <a-marker type="barcode" value="2" id="marker-2">
        <a-entity id="content-2" visible="false">
          <a-entity 
            gltf-model="#salmon-model" 
            scale="0.6 0.6 0.6" 
            rotation="-90 0 0"
            position="0 0 0">
          </a-entity>
          <a-text value="Nigiris" position="0 0 0.8" rotation="-90 0 0" align="center" color="#FFF" scale="2 2 2"></a-text>
        </a-entity>
      </a-marker>

      <!-- MARKER 3: SUSHI MAIN -->
      <a-marker type="barcode" value="3" id="marker-3">
        <a-entity id="content-3" visible="false">
          <a-entity 
            gltf-model="#sushi-model" 
            scale="0.6 0.6 0.6" 
            rotation="-90 0 0"
            position="0 0 0">
          </a-entity>
          <a-text value="Makis" position="0 0 0.8" rotation="-90 0 0" align="center" color="#FFF" scale="2 2 2"></a-text>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const debugText = document.getElementById('debug-text');
      const captureBtn = document.getElementById('capture-btn');
      let activeMarkerId = null;

      const scene = document.querySelector('a-scene');

      scene.addEventListener('loaded', () => {
        debugText.innerText = "Cámara lista. Apunta a un código.";
        console.log("Scene loaded");
      });

      // Capture Button Logic
      captureBtn.addEventListener('click', () => {
        // 1. Get the AR.js video element (camera feed)
        const video = document.querySelector('video');
        // 2. Get the A-Frame WebGL canvas (3D models)
        const sceneEl = document.querySelector('a-scene');
        const glCanvas = sceneEl.components.screenshot.getCanvas('perspective');
        
        if (!video || !glCanvas) return;

        // 3. Create a temporary canvas to merge both
        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = glCanvas.width;
        captureCanvas.height = glCanvas.height;
        const ctx = captureCanvas.getContext('2d');

        // 4. Draw Video (Scale to fit)
        // Note: AR.js video sizing can be tricky. We draw it to cover the canvas.
        ctx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

        // 5. Draw WebGL Scene on top
        ctx.drawImage(glCanvas, 0, 0);

        // 6. Download the merged image
        const link = document.createElement('a');
        link.download = `web-ar-foto-${Date.now()}.png`;
        link.href = captureCanvas.toDataURL('image/png');
        link.click();
      });

      // Handle marker detection with STRICT single-model logic
      [0, 1, 2, 3].forEach(id => {
        const marker = document.getElementById('marker-' + id);
        const contentEntity = document.getElementById('content-' + id);
        
        marker.addEventListener('markerFound', () => {
          // If NO marker is currently active, lock this one and show it
          if (activeMarkerId === null) {
            activeMarkerId = id;
            contentEntity.setAttribute('visible', 'true');
            debugText.innerText = `Mostrando plato ${id}`;
          } 
          // If THIS marker is already active (redundant check but safe), ensure visible
          else if (activeMarkerId === id) {
            contentEntity.setAttribute('visible', 'true');
          }
          // If ANOTHER marker is active, keep this one HIDDEN
          else {
            contentEntity.setAttribute('visible', 'false');
          }
        });

        marker.addEventListener('markerLost', () => {
          // Only reset if the lost marker was the active one
          if (activeMarkerId === id) {
            activeMarkerId = null;
            contentEntity.setAttribute('visible', 'false');
            debugText.innerText = "Buscando códigos...";
          }
        });
      });
    </script>
  </body>
</html>
