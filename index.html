<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Experience</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@v1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
      :root {
        --primary-color: #ff4757;
        --secondary-color: #2f3542;
        --accent-color: #ffffff;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
      }
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: radial-gradient(circle, #2f3542 0%, #000000 100%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top: 5px solid var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .ui-container {
        position: absolute;
        bottom: 40px;
        left: 0;
        right: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      .hint-text {
        background: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        margin-bottom: 20px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: fadeInOut 3s infinite;
      }
      @keyframes fadeInOut {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 30px;
        pointer-events: auto;
      }
      .screenshot-btn {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 5px solid white;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
        position: relative;
      }
      .screenshot-btn::after {
        content: '';
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 50%;
        transition: all 0.2s;
      }
      .screenshot-btn:active {
        transform: scale(0.9);
      }
      .screenshot-btn:active::after {
        transform: scale(0.8);
        background: var(--primary-color);
      }
      .header-ui {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1000;
        color: white;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      .header-ui h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 2px;
        font-weight: 300;
        text-transform: uppercase;
      }
      .flash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        z-index: 2000;
        opacity: 0;
        pointer-events: none;
      }
      .flash.active {
        animation: flashAnim 0.5s;
      }
      @keyframes flashAnim {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
      .product-panel {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.7);
        color: #ffffff;
        padding: 12px 16px;
        border-radius: 12px;
        max-width: 260px;
        font-size: 13px;
        display: none;
        backdrop-filter: blur(6px);
      }
      .product-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .product-price {
        font-weight: 500;
        margin-bottom: 8px;
      }
      .product-section-title {
        font-size: 12px;
        opacity: 0.9;
        margin-bottom: 2px;
      }
      .product-ingredients {
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <div class="flash" id="flash-effect"></div>

    <div class="product-panel" id="product-panel">
      <div class="product-title" id="product-title"></div>
      <div class="product-price" id="product-price"></div>
      <div class="product-section-title">Ingredientes</div>
      <div class="product-ingredients" id="product-ingredients"></div>
    </div>

    <div class="ui-container">
      <div class="controls">
        <div class="screenshot-btn" id="screenshot"></div>
      </div>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="antialias: true; logarithmicDepthBuffer: true; colorManagement: true; preserveDrawingBuffer: true;"
      vr-mode-ui="enabled: false"
      screenshot>
      
      <a-assets>
        <a-asset-item id="coffe-model" src="./coffe2.glb"></a-asset-item>
        <a-asset-item id="sushi-model" src="./sushi.glb"></a-asset-item>
        <a-asset-item id="pizza-model" src="./pizza.glb"></a-asset-item>
        <a-asset-item id="burger-model" src="./hamburger.glb"></a-asset-item>
      </a-assets>

      <!-- Marcador de Café 2 (Carta Yu-Gi-Oh) -->
      <a-nft 
        type="nft" 
        url="./markers/cafe"
        emitevents="true"
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5">
        <a-entity
          gltf-model="#coffe-model"
          scale="7 7 7"
          position="0 0 0"
          rotation="-90 0 0">
        </a-entity>
      </a-nft>

      <!-- Marcador de Sushi -->
      <a-nft type="nft" url="./markers/sushi" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#sushi-model"
          scale="6 6 6"
          position="0 0 0"
          rotation="-90 0 0">
        </a-entity>
      </a-nft>

      <!-- Marcador de Pizza -->
      <a-nft type="nft" url="./markers/pizza" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#pizza-model"
          scale="4.5 4.5 4.5"
          position="0 0 0"
          rotation="-90 0 0">
        </a-entity>
      </a-nft>

      <!-- Marcador de Hamburguesa -->
      <a-nft type="nft" url="./markers/burger" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#burger-model"
          scale="0.002 0.002 0.002"
          position="0 -0.6 0"
          rotation="-90 0 0">
        </a-entity>
      </a-nft>
      
      <a-marker type="pattern" url="./pattern-caffe.patt" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#coffe-model"
          scale="7 7 7"
          position="0 -0.6 0"
          rotation="0 0 0">
        </a-entity>
      </a-marker>
      <a-marker type="pattern" url="./pattern-sushi.patt" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#sushi-model"
          scale="6 6 6"
          position="0 -0.6 0"
          rotation="0 0 0">
        </a-entity>
      </a-marker>
      <a-marker type="pattern" url="./pattern-pizza.patt" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#pizza-model"
          scale="4.5 4.5 4.5"
          position="0 -0.6 0"
          rotation="0 0 0">
        </a-entity>
      </a-marker>
      <a-marker type="pattern" url="./pattern-hamburguesa.patt" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#burger-model"
          scale="0.002 0.002 0.002"
          position="0 -0.6 0"
          rotation="0 0 0">
        </a-entity>
      </a-marker>
      <a-marker preset="hiro" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#coffe-model"
          scale="7 7 7"
          position="0 -0.6 0"
          rotation="0 0 0">
        </a-entity>
      </a-marker>
      
      <a-marker type="barcode" value="5" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#coffe-model"
          scale="7 7 7"
          position="0 -0.6 0"
          rotation="-90 0 0">
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="6" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#sushi-model"
          scale="6 6 6"
          position="0 -0.6 0"
          rotation="-90 0 0">
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="7" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#pizza-model"
          scale="4.5 4.5 4.5"
          position="0 -0.6 0"
          rotation="-90 0 0">
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="8" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity
          gltf-model="#burger-model"
          scale="0.002 0.002 0.002"
          position="0 -0.6 0"
          rotation="-90 0 0">
        </a-entity>
      </a-marker>
      
      <a-entity light="type: ambient; color: #FFF; intensity: 1.2"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-1 1 1"></a-entity>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const productPanel = document.getElementById('product-panel');
      const productTitle = document.getElementById('product-title');
      const productPrice = document.getElementById('product-price');
      const productIngredients = document.getElementById('product-ingredients');
      const products = {
        cafe: {
          title: 'Café Americano',
          price: 'S/ 8.00',
          ingredients: 'Café 100% arábica, agua filtrada.'
        },
        sushi: {
          title: 'Sushi mixto',
          price: 'S/ 18.00',
          ingredients: 'Arroz sazonado, salmón, palta, alga nori, salsa de soya.'
        },
        pizza: {
          title: 'Pizza clásica',
          price: 'S/ 16.00',
          ingredients: 'Masa artesanal, salsa de tomate, queso mozzarella, orégano.'
        },
        burger: {
          title: 'Hamburguesa de la casa',
          price: 'S/ 18.00',
          ingredients: 'Carne de res, queso cheddar, lechuga, tomate, salsa especial.'
        }
      };
      function getProductKeyFromMarker(marker) {
        const url = marker.getAttribute('url') || '';
        const value = marker.getAttribute('value');
        const preset = marker.getAttribute('preset');
        if (url.indexOf('cafe') !== -1 || url.indexOf('caffe') !== -1) return 'cafe';
        if (url.indexOf('sushi') !== -1) return 'sushi';
        if (url.indexOf('pizza') !== -1) return 'pizza';
        if (url.indexOf('burger') !== -1 || url.indexOf('hamburguesa') !== -1) return 'burger';
        if (value === '5') return 'cafe';
        if (value === '6') return 'sushi';
        if (value === '7') return 'pizza';
        if (value === '8') return 'burger';
        if (preset === 'hiro') return 'cafe';
        return null;
      }
      function showProduct(key) {
        if (!productPanel) return;
        const p = products[key];
        if (!p) return;
        productTitle.textContent = p.title;
        productPrice.textContent = p.price;
        productIngredients.textContent = p.ingredients;
        productPanel.style.display = 'block';
      }
      function hideProduct() {
        if (!productPanel) return;
        productPanel.style.display = 'none';
      }

      // Funcionalidad para tomar captura (Foto)
      document.getElementById('screenshot').addEventListener('click', function() {
        // Efecto de flash
        const flash = document.getElementById('flash-effect');
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 500);

        const scene = document.querySelector('a-scene');
        const video = document.querySelector('video');
        
        // Crear canvas final con el tamaño real del video
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = video.videoWidth;
        finalCanvas.height = video.videoHeight;
        const ctx = finalCanvas.getContext('2d');

        // 1. Dibujar el video de fondo
        ctx.drawImage(video, 0, 0, finalCanvas.width, finalCanvas.height);
        
        // 2. Dibujar la capa de AR (A-Frame)
        scene.renderer.render(scene.object3D, scene.camera);
        ctx.drawImage(scene.canvas, 0, 0, finalCanvas.width, finalCanvas.height);

        // 3. Descargar la captura
        try {
          const dataURL = finalCanvas.toDataURL('image/png');
          const link = document.createElement('a');
          const date = new Date().getTime();
          link.download = `Captura-MenuAR-${date}.png`;
          link.href = dataURL;
          link.click();
        } catch (err) {
          console.error("Error al tomar la captura:", err);
        }
      });
      
      ;(() => {
        const markers = Array.from(document.querySelectorAll('a-marker, a-nft'));
        markers.forEach(m => {
          m.addEventListener('markerFound', () => {
            console.log('markerFound', m.getAttribute('url') || m.getAttribute('value') || m.getAttribute('type'));
            const key = getProductKeyFromMarker(m);
            if (key) showProduct(key);
          });
          m.addEventListener('markerLost', () => {
            console.log('markerLost', m.getAttribute('url') || m.getAttribute('value') || m.getAttribute('type'));
            hideProduct();
          });
        });
      })();
    </script>
  </body>
</html>
