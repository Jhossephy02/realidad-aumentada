<!DOCTYPE html>
<html>
  <head>
    <title>WebAR - Escáner de Códigos de Barras v3 (No Text)</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js for Barcode/Marker Tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      .capture-button {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 60px;
        background-color: rgba(255, 255, 255, 0.8);
        border: 4px solid white;
        border-radius: 50%;
        z-index: 1000;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      
      .capture-button:active {
        background-color: white;
        transform: translateX(-50%) scale(0.95);
      }

      .capture-icon {
        width: 24px;
        height: 24px;
        background-color: #333;
        border-radius: 50%;
      }

      /* Info Panel Styles */
      .info-panel {
        position: fixed;
        bottom: 110px; /* Above capture button */
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 400px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 15px;
        z-index: 900;
        display: none; /* Hidden by default */
        text-align: center;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: opacity 0.3s ease;
      }

      .info-panel h2 {
        margin: 0 0 5px 0;
        font-size: 1.2rem;
        color: #ff9800; /* Orange accent */
      }

      .info-panel p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
        color: #ddd;
      }

      .info-panel .price {
        display: block;
        margin-top: 8px;
        font-weight: bold;
        font-size: 1.1rem;
        color: #4caf50; /* Green for price */
      }

      /* Flash Effect Overlay */
      #flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        opacity: 0;
        z-index: 2000;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
      }
      .flash-active {
        opacity: 0.8 !important;
      }
    </style>
  </head>
  <body>
    <!-- Flash Overlay -->
    <div id="flash-overlay"></div>

    <!-- Capture Button -->
    <div class="capture-button" id="capture-btn">
      <div class="capture-icon"></div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="info-panel">
      <h2 id="panel-title">Nombre del Plato</h2>
      <p id="panel-desc">Descripción del plato aquí.</p>
      <span class="price" id="panel-price">S/ 0.00</span>
      <p style="font-size: 0.7rem; color: #aaa; margin-top: 5px;">(Pellizca para escalar)</p>
    </div>
    
    <!-- Hidden Debug Element to prevent JS errors -->
    <div id="debug-text" style="display: none;"></div>

    <!-- AR.js Scene Setup for 3x3 Barcodes -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true; precision: medium; preserveDrawingBuffer: true;"
      vr-mode-ui="enabled: false"
      gesture-detector>

      <script>
        // Component to handle pinch gestures for scaling
        AFRAME.registerComponent('gesture-detector', {
          schema: {
            element: { default: '' }
          },
          init: function() {
            this.targetElement = this.data.element && document.querySelector(this.data.element);
            if (!this.targetElement) {
              this.targetElement = this.el;
            }
            this.internalState = {
              previousState: null
            };
            this.emitGestureEvent = this.emitGestureEvent.bind(this);
            this.targetElement.addEventListener("touchstart", this.emitGestureEvent);
            this.targetElement.addEventListener("touchend", this.emitGestureEvent);
            this.targetElement.addEventListener("touchmove", this.emitGestureEvent);
          },
          remove: function() {
            this.targetElement.removeEventListener("touchstart", this.emitGestureEvent);
            this.targetElement.removeEventListener("touchend", this.emitGestureEvent);
            this.targetElement.removeEventListener("touchmove", this.emitGestureEvent);
          },
          emitGestureEvent: function(event) {
            const currentState = this.getTouchState(event);
            const previousState = this.internalState.previousState;
            const gestureContinues = previousState && currentState && currentState.touchCount == previousState.touchCount;
            const gestureEnded = previousState && !gestureContinues;
            const gestureStarted = currentState && !gestureContinues;

            if (gestureEnded) {
              const eventName = this.getEventPrefix(previousState.touchCount) + "fingerend";
              this.el.emit(eventName, previousState);
              this.internalState.previousState = null;
            }
            if (gestureStarted) {
              currentState.startTime = performance.now();
              currentState.startPosition = currentState.position;
              currentState.startSpread = currentState.spread;
              const eventName = this.getEventPrefix(currentState.touchCount) + "fingerstart";
              this.el.emit(eventName, currentState);
              this.internalState.previousState = currentState;
            }
            if (gestureContinues) {
              const eventDetail = {
                positionChange: {
                  x: currentState.position.x - previousState.position.x,
                  y: currentState.position.y - previousState.position.y
                },
                spreadChange: currentState.spread - previousState.spread,
                startSpread: currentState.startSpread,
                originalEvent: event
              };
              const eventName = this.getEventPrefix(currentState.touchCount) + "fingermove";
              this.el.emit(eventName, eventDetail);
              this.internalState.previousState = currentState;
            }
          },
          getTouchState: function(event) {
            if (event.touches.length === 0) {
              return null;
            }
            const touchList = [];
            for (let i = 0; i < event.touches.length; i++) {
              touchList.push(event.touches[i]);
            }
            const touchState = {
              touchCount: touchList.length
            };
            const centerPositionRawX = touchList.reduce((sum, touch) => sum + touch.clientX, 0) / touchList.length;
            const centerPositionRawY = touchList.reduce((sum, touch) => sum + touch.clientY, 0) / touchList.length;
            touchState.position = {
              x: centerPositionRawX,
              y: centerPositionRawY
            };
            if (touchList.length >= 2) {
              const spread = Math.abs(touchList[0].clientX - touchList[1].clientX) + Math.abs(touchList[0].clientY - touchList[1].clientY);
              touchState.spread = spread;
            }
            return touchState;
          },
          getEventPrefix: function(touchCount) {
            const numberNames = ["one", "two", "three", "many"];
            return numberNames[Math.min(touchCount, 4) - 1];
          }
        });

        AFRAME.registerComponent('pinch-scale', {
          schema: {
            min: { default: 0.1 },
            max: { default: 20 }
          },
          init: function() {
            this.initialScale = this.el.object3D.scale.clone();
            this.scaleFactor = 1;
            this.handleEvent = this.handleEvent.bind(this);
            this.el.sceneEl.addEventListener("twofingermove", this.handleEvent);
          },
          remove: function() {
            this.el.sceneEl.removeEventListener("twofingermove", this.handleEvent);
          },
          handleEvent: function(event) {
            // Only scale if this entity is visible (active marker)
            if (this.el.getAttribute('visible') === false) return;

            this.scaleFactor *= 1 + event.detail.spreadChange / event.detail.startSpread;
            this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.min), this.data.max);

            this.el.object3D.scale.x = this.initialScale.x * this.scaleFactor;
            this.el.object3D.scale.y = this.initialScale.y * this.scaleFactor;
            this.el.object3D.scale.z = this.initialScale.z * this.scaleFactor;
          }
        });
      </script>

      <a-assets>
        <a-asset-item id="ramen-model" src="models/sushi/shrimp_ramen_bowl.glb"></a-asset-item>
        <a-asset-item id="roll-model" src="models/sushi/sushi_rolls.glb?v=2"></a-asset-item>
        <a-asset-item id="salmon-model" src="models/sushi/salmon_nigiri.glb"></a-asset-item>
        <a-asset-item id="sushi-model" src="models/sushi/sushi.glb"></a-asset-item>
      </a-assets>

      <!-- Lighting to ensure models are visible -->
      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="directional" position="0 1 0" intensity="1.5" target="#directionaltarget">
        <a-entity id="directionaltarget" position="0 0 0"></a-entity>
      </a-light>

      <!-- Marker 0: Ramen -->
      <a-marker type="barcode" value="0" id="marker-0">
        <a-entity id="content-0" visible="false" pinch-scale class="clickable" data-id="0">
            <!-- 3D Model -->
            <a-entity 
              gltf-model="#ramen-model" 
              scale="3.0 3.0 3.0" 
              rotation="0 0 0"
              position="0 0 0">
            </a-entity>
        </a-entity>
      </a-marker>

      <!-- Marker 1: Roll -->
      <a-marker type="barcode" value="1" id="marker-1">
        <a-entity id="content-1" visible="false" pinch-scale class="clickable" data-id="1">
            <!-- 3D Model -->
            <a-entity 
              gltf-model="#roll-model" 
              scale="8.0 8.0 8.0" 
              rotation="0 0 0"
              position="0 0 0">
            </a-entity>
        </a-entity>
      </a-marker>

      <!-- Marker 2: Salmon (Nigiri) -->
      <a-marker type="barcode" value="2" id="marker-2">
        <a-entity id="content-2" visible="false" pinch-scale class="clickable" data-id="2">
            <!-- 3D Model -->
            <a-entity 
              gltf-model="#salmon-model" 
              scale="0.5 0.5 0.5" 
              rotation="0 0 0"
              position="0 0 0">
            </a-entity>
        </a-entity>
      </a-marker>

      <!-- Marker 3: Sushi (Makis) -->
      <a-marker type="barcode" value="3" id="marker-3">
        <a-entity id="content-3" visible="false" pinch-scale class="clickable" data-id="3">
            <!-- 3D Model -->
            <a-entity 
              gltf-model="#sushi-model" 
              scale="8.0 8.0 8.0" 
              rotation="0 0 0"
              position="0 0 0">
            </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <script>
      const debugText = document.getElementById('debug-text');
      const captureBtn = document.getElementById('capture-btn');
      const infoPanel = document.getElementById('info-panel');
      const panelTitle = document.getElementById('panel-title');
      const panelDesc = document.getElementById('panel-desc');
      const panelPrice = document.getElementById('panel-price');
      const flashOverlay = document.getElementById('flash-overlay');

      let activeMarkerId = null;

      // Dish Data
      const dishes = {
        0: {
          name: "Zelva Ramen",
          desc: "Ramen de la casa, ideal para el frío y para experiencias AR inmersivas.",
          price: "S/ 32.00"
        },
        1: {
          name: "Volcano Roll",
          desc: "Delicioso rollo con salsa volcánica y relleno especial.",
          price: "S/ 25.00"
        },
        2: {
          name: "Nigiris Especiales",
          desc: "Selección de nigiris con salmón fresco y toques cítricos.",
          price: "S/ 15.00"
        },
        3: {
          name: "Makis New Styles",
          desc: "Makis New Styles de Zelva Nikkei (Amazon, Anticuchero, Banzai, Kaminaki, Parrillero, Pulpo al Olivo, Jalea).",
          price: "S/ 25.00"
        }
      };

      const scene = document.querySelector('a-scene');

      scene.addEventListener('loaded', () => {
        debugText.innerText = "Cámara lista. Apunta a un código.";
        console.log("Scene loaded");
      });

      // Capture Button Logic
      captureBtn.addEventListener('click', () => {
        // Visual Feedback (Flash) - Trigger immediately
        flashOverlay.classList.add('flash-active');
        setTimeout(() => {
          flashOverlay.classList.remove('flash-active');
        }, 150);

        // 1. Setup Capture Canvas (Match Viewport)
        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = window.innerWidth;
        captureCanvas.height = window.innerHeight;
        const ctx = captureCanvas.getContext('2d');

        // 2. Draw Video (Camera Feed) - Correctly Scaled (Cover)
        const video = document.querySelector('video');
        if (video) {
          const vRatio = video.videoWidth / video.videoHeight;
          const cRatio = captureCanvas.width / captureCanvas.height;
          let sWidth, sHeight, sx, sy;

          // Object-fit: cover logic
          if (cRatio > vRatio) {
            sWidth = video.videoWidth;
            sHeight = video.videoWidth / cRatio;
            sx = 0;
            sy = (video.videoHeight - sHeight) / 2;
          } else {
            sWidth = video.videoHeight * cRatio;
            sHeight = video.videoHeight;
            sx = (video.videoWidth - sWidth) / 2;
            sy = 0;
          }
          
          ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, captureCanvas.width, captureCanvas.height);
        }

        // 3. Draw WebGL Scene (Models)
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.canvas) {
          // FORCE RENDER to ensure model is in buffer
          sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
          
          const glCanvas = sceneEl.canvas;
          ctx.drawImage(glCanvas, 0, 0, captureCanvas.width, captureCanvas.height);
        }

        // 5. Download
        const link = document.createElement('a');
        link.download = `web-ar-capture-${Date.now()}.png`;
        link.href = captureCanvas.toDataURL('image/png');
        link.click();
      });

      // Helper to update Info Panel
      function showInfo(id) {
        if (dishes[id]) {
            panelTitle.innerText = dishes[id].name;
            panelDesc.innerText = dishes[id].desc;
            panelPrice.innerText = dishes[id].price;
            infoPanel.style.display = 'block';
            activeMarkerId = id;
            debugText.innerText = `Seleccionado: ${dishes[id].name}`;
        }
      }

      // Handle marker detection
      [0, 1, 2, 3].forEach(id => {
        const marker = document.getElementById('marker-' + id);
        const contentEntity = document.getElementById('content-' + id);
        
        // Marker Found: Show model, and maybe auto-select if nothing is selected
        marker.addEventListener('markerFound', () => {
          contentEntity.setAttribute('visible', 'true');
          
          // Auto-select if no panel is currently showing
          if (activeMarkerId === null || infoPanel.style.display === 'none') {
            showInfo(id);
          }
        });

        // Marker Lost: Hide model. If it was the selected one, hide panel.
        marker.addEventListener('markerLost', () => {
          contentEntity.setAttribute('visible', 'false');
          
          if (activeMarkerId === id) {
            infoPanel.style.display = 'none';
            activeMarkerId = null;
            debugText.innerText = "Buscando códigos...";
          }
        });

        // Click Interaction: Explicitly select this dish
        contentEntity.addEventListener('click', (evt) => {
            // Prevent double-firing if nested
            evt.stopPropagation();
            showInfo(id);
        });
      });
    </script>
  </body>
</html>
