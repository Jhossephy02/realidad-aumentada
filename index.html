<!DOCTYPE html>
<html>
  <head>
    <title>WebAR - Escáner de Códigos de Barras v3 (No Text)</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js for Barcode/Marker Tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      .capture-button {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 60px;
        background-color: rgba(255, 255, 255, 0.8);
        border: 4px solid white;
        border-radius: 50%;
        z-index: 1000;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      
      .capture-button:active {
        background-color: white;
        transform: translateX(-50%) scale(0.95);
      }

      .capture-icon {
        width: 24px;
        height: 24px;
        background-color: #333;
        border-radius: 50%;
      }

      /* Info Panel Styles */
      .info-panel {
        position: fixed;
        bottom: 110px; /* Above capture button */
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 400px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 15px;
        z-index: 900;
        display: none; /* Hidden by default */
        text-align: center;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: opacity 0.3s ease;
      }

      .info-panel h2 {
        margin: 0 0 5px 0;
        font-size: 1.2rem;
        color: #ff9800; /* Orange accent */
      }

      .info-panel p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
        color: #ddd;
      }

      .info-panel .price {
        display: block;
        margin-top: 8px;
        font-weight: bold;
        font-size: 1.1rem;
        color: #4caf50; /* Green for price */
      }

      /* Flash Effect Overlay */
      #flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        opacity: 0;
        z-index: 2000;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
      }
      .flash-active {
        opacity: 0.8 !important;
      }
    </style>
  </head>
  <body>
    <!-- Flash Overlay -->
    <div id="flash-overlay"></div>

    <!-- Capture Button -->
    <div class="capture-button" id="capture-btn">
      <div class="capture-icon"></div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="info-panel">
      <h2 id="panel-title">Nombre del Plato</h2>
      <p id="panel-desc">Descripción del plato aquí.</p>
      <span class="price" id="panel-price">S/ 0.00</span>
    </div>
    
    <!-- Hidden Debug Element to prevent JS errors -->
    <div id="debug-text" style="display: none;"></div>

    <!-- AR.js Scene Setup for 3x3 Barcodes -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true; precision: medium; preserveDrawingBuffer: true;"
      vr-mode-ui="enabled: false">

      <a-assets>
        <a-asset-item id="ramen-model" src="models/sushi/shrimp_ramen_bowl.glb"></a-asset-item>
        <a-asset-item id="roll-model" src="models/sushi/sushi_rolls.glb?v=2"></a-asset-item>
        <a-asset-item id="salmon-model" src="models/sushi/salmon_nigiri.glb"></a-asset-item>
        <a-asset-item id="sushi-model" src="models/sushi/sushi.glb"></a-asset-item>
      </a-assets>

      <!-- Lighting to ensure models are visible -->
      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="directional" position="0 1 0" intensity="1.5" target="#directionaltarget">
        <a-entity id="directionaltarget" position="0 0 0"></a-entity>
      </a-light>

      <!-- MARKER 0: RAMEN -->
      <a-marker type="barcode" value="0" id="marker-0">
        <a-entity id="content-0" visible="false">
          <a-entity 
            gltf-model="#ramen-model" 
            scale="1.5 1.5 1.5" 
            rotation="0 0 0"
            position="0 0 0">
          </a-entity>
        </a-entity>
      </a-marker>

      <!-- MARKER 1: SUSHI ROLL (Increased Scale) -->
      <a-marker type="barcode" value="1" id="marker-1">
        <a-entity id="content-1" visible="false">
          <a-entity 
            gltf-model="#roll-model" 
            scale="5.0 5.0 5.0" 
            rotation="0 0 0"
            position="0 0 0">
          </a-entity>
        </a-entity>
      </a-marker>

      <!-- MARKER 2: SALMON (Decreased Scale) -->
      <a-marker type="barcode" value="2" id="marker-2">
        <a-entity id="content-2" visible="false">
          <a-entity 
            gltf-model="#salmon-model" 
            scale="0.2 0.2 0.2" 
            rotation="0 0 0"
            position="0 0 0">
          </a-entity>
        </a-entity>
      </a-marker>

      <!-- MARKER 3: SUSHI MAIN (Increased Scale) -->
      <a-marker type="barcode" value="3" id="marker-3">
        <a-entity id="content-3" visible="false">
          <a-entity 
            gltf-model="#sushi-model" 
            scale="5.0 5.0 5.0" 
            rotation="0 0 0"
            position="0 0 0">
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const debugText = document.getElementById('debug-text');
      const captureBtn = document.getElementById('capture-btn');
      const infoPanel = document.getElementById('info-panel');
      const panelTitle = document.getElementById('panel-title');
      const panelDesc = document.getElementById('panel-desc');
      const panelPrice = document.getElementById('panel-price');
      const flashOverlay = document.getElementById('flash-overlay');

      let activeMarkerId = null;

      // Dish Data
      const dishes = {
        0: {
          name: "Zelva Ramen",
          desc: "Ramen de la casa, ideal para el frío y para experiencias AR inmersivas.",
          price: "S/ 32.00"
        },
        1: {
          name: "Volcano Roll",
          desc: "Delicioso rollo con salsa volcánica y relleno especial.",
          price: "S/ 25.00"
        },
        2: {
          name: "Nigiris Especiales",
          desc: "Selección de nigiris con salmón fresco y toques cítricos.",
          price: "S/ 15.00"
        },
        3: {
          name: "Makis New Styles",
          desc: "Makis New Styles de Zelva Nikkei (Amazon, Anticuchero, Banzai, Kaminaki, Parrillero, Pulpo al Olivo, Jalea).",
          price: "S/ 25.00"
        }
      };

      const scene = document.querySelector('a-scene');

      scene.addEventListener('loaded', () => {
        debugText.innerText = "Cámara lista. Apunta a un código.";
        console.log("Scene loaded");
      });

      // Capture Button Logic
      captureBtn.addEventListener('click', () => {
        // Visual Feedback (Flash) - Trigger immediately
        flashOverlay.classList.add('flash-active');
        setTimeout(() => {
          flashOverlay.classList.remove('flash-active');
        }, 150);

        // 1. Setup Capture Canvas (Match Viewport)
        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = window.innerWidth;
        captureCanvas.height = window.innerHeight;
        const ctx = captureCanvas.getContext('2d');

        // 2. Draw Video (Camera Feed) - Correctly Scaled (Cover)
        const video = document.querySelector('video');
        if (video) {
          const vRatio = video.videoWidth / video.videoHeight;
          const cRatio = captureCanvas.width / captureCanvas.height;
          let sWidth, sHeight, sx, sy;

          // Object-fit: cover logic
          if (cRatio > vRatio) {
            sWidth = video.videoWidth;
            sHeight = video.videoWidth / cRatio;
            sx = 0;
            sy = (video.videoHeight - sHeight) / 2;
          } else {
            sWidth = video.videoHeight * cRatio;
            sHeight = video.videoHeight;
            sx = (video.videoWidth - sWidth) / 2;
            sy = 0;
          }
          
          ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, captureCanvas.width, captureCanvas.height);
        }

        // 3. Draw WebGL Scene (Models)
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.canvas) {
          // FORCE RENDER to ensure model is in buffer
          sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
          
          const glCanvas = sceneEl.canvas;
          ctx.drawImage(glCanvas, 0, 0, captureCanvas.width, captureCanvas.height);
        }

        // 4. Draw Info Panel (Optional - Simple Text Overlay if needed, or skip)
        // For now, we focus on the Models + Camera request.

        // 5. Download
        const link = document.createElement('a');
        link.download = `web-ar-capture-${Date.now()}.png`;
        link.href = captureCanvas.toDataURL('image/png');
        link.click();
      });

      // Handle marker detection with STRICT single-model logic
      [0, 1, 2, 3].forEach(id => {
        const marker = document.getElementById('marker-' + id);
        const contentEntity = document.getElementById('content-' + id);
        
        marker.addEventListener('markerFound', () => {
          // If NO marker is currently active, lock this one and show it
          if (activeMarkerId === null) {
            activeMarkerId = id;
            contentEntity.setAttribute('visible', 'true');
            
            // Update Info Panel
            if (dishes[id]) {
                panelTitle.innerText = dishes[id].name;
                panelDesc.innerText = dishes[id].desc;
                panelPrice.innerText = dishes[id].price;
                infoPanel.style.display = 'block';
            }
            
            debugText.innerText = `Mostrando plato ${id}`;
          } 
          // If THIS marker is already active (redundant check but safe), ensure visible
          else if (activeMarkerId === id) {
            contentEntity.setAttribute('visible', 'true');
            infoPanel.style.display = 'block';
          }
          // If ANOTHER marker is active, keep this one HIDDEN
          else {
            contentEntity.setAttribute('visible', 'false');
          }
        });

        marker.addEventListener('markerLost', () => {
          // Only reset if the lost marker was the active one
          if (activeMarkerId === id) {
            activeMarkerId = null;
            contentEntity.setAttribute('visible', 'false');
            infoPanel.style.display = 'none'; // Hide panel
            debugText.innerText = "Buscando códigos...";
          }
        });
      });
    </script>
  </body>
</html>
