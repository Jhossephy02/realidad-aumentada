<!DOCTYPE html>
<html>
  <head>
    <title>WebAR - V6 (RAYCASTER)</title>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      .capture-button {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 60px;
        background-color: rgba(255, 255, 255, 0.8);
        border: 4px solid white;
        border-radius: 50%;
        z-index: 1000;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      
      .capture-button:active {
        background-color: white;
        transform: translateX(-50%) scale(0.95);
      }

      .capture-icon {
        width: 24px;
        height: 24px;
        background-color: #333;
        border-radius: 50%;
      }

      /* Info Panel Styles */
      .info-panel {
        position: fixed;
        bottom: 110px; /* Above capture button */
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 400px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 15px;
        z-index: 900;
        display: none; /* Hidden by default */
        text-align: center;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: opacity 0.3s ease;
      }

      .info-panel h2 {
        margin: 0 0 5px 0;
        font-size: 1.2rem;
        color: #ff9800; /* Orange accent */
      }

      .info-panel p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.4;
        color: #ddd;
      }

      .info-panel .price {
        display: block;
        margin-top: 8px;
        font-weight: bold;
        font-size: 1.1rem;
        color: #4caf50; /* Green for price */
      }

      /* Flash Effect Overlay */
      #flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        opacity: 0;
        z-index: 2000;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
      }
      .flash-active {
        opacity: 0.8 !important;
      }
    </style>
  </head>

    <!-- AR.js Scene Setup for 3x3 Barcodes -->

      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; smoothing: true; smoothingAmount: 0.5;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true; precision: medium; preserveDrawingBuffer: true;"
      vr-mode-ui="enabled: false"
      gesture-detector
      id="scene"
      enforce-exclusivity>

      <script>
        // Component to handle pinch gestures for scaling
        AFRAME.registerComponent('gesture-detector', {
          schema: {
            element: { default: '' }
          },
          init: function() {
            this.targetElement = this.data.element && document.querySelector(this.data.element);
            if (!this.targetElement) {
              this.targetElement = this.el;
            }
            this.internalState = {
              previousState: null
            };
            this.emitGestureEvent = this.emitGestureEvent.bind(this);
            this.targetElement.addEventListener("touchstart", this.emitGestureEvent);
            this.targetElement.addEventListener("touchend", this.emitGestureEvent);
            this.targetElement.addEventListener("touchmove", this.emitGestureEvent);
          },
          remove: function() {
            this.targetElement.removeEventListener("touchstart", this.emitGestureEvent);
            this.targetElement.removeEventListener("touchend", this.emitGestureEvent);
            this.targetElement.removeEventListener("touchmove", this.emitGestureEvent);
          },
          emitGestureEvent: function(event) {
            const currentState = this.getTouchState(event);
            const previousState = this.internalState.previousState;
            const gestureContinues = previousState && currentState && currentState.touchCount == previousState.touchCount;
            const gestureEnded = previousState && !gestureContinues;
            const gestureStarted = currentState && !gestureContinues;

            if (gestureEnded) {
              const eventName = this.getEventPrefix(previousState.touchCount) + "fingerend";
              this.el.emit(eventName, previousState);
              this.internalState.previousState = null;
            }
            if (gestureStarted) {
              currentState.startTime = performance.now();
              currentState.startPosition = currentState.position;
              currentState.startSpread = currentState.spread;
              const eventName = this.getEventPrefix(currentState.touchCount) + "fingerstart";
              this.el.emit(eventName, currentState);
              this.internalState.previousState = currentState;
            }
            if (gestureContinues) {
              currentState.startSpread = previousState.startSpread;
              const eventDetail = {
                positionChange: {
                  x: currentState.position.x - previousState.position.x,
                  y: currentState.position.y - previousState.position.y
                },
                spreadChange: currentState.spread - previousState.spread,
                spread: currentState.spread,
                startSpread: currentState.startSpread,
                originalEvent: event
              };
              const eventName = this.getEventPrefix(currentState.touchCount) + "fingermove";
              this.el.emit(eventName, eventDetail);
              this.internalState.previousState = currentState;
            }
          },
          getTouchState: function(event) {
            if (event.touches.length === 0) {
              return null;
            }
            const touchList = [];
            for (let i = 0; i < event.touches.length; i++) {
              touchList.push(event.touches[i]);
            }
            const touchState = {
              touchCount: touchList.length
            };
            const centerPositionRawX = touchList.reduce((sum, touch) => sum + touch.clientX, 0) / touchList.length;
            const centerPositionRawY = touchList.reduce((sum, touch) => sum + touch.clientY, 0) / touchList.length;
            touchState.position = {
              x: centerPositionRawX,
              y: centerPositionRawY
            };
            if (touchList.length >= 2) {
              const spread = Math.abs(touchList[0].clientX - touchList[1].clientX) + Math.abs(touchList[0].clientY - touchList[1].clientY);
              touchState.spread = spread;
            }
            return touchState;
          },
          getEventPrefix: function(touchCount) {
            const numberNames = ["one", "two", "three", "many"];
            return numberNames[Math.min(touchCount, 4) - 1];
          }
        });

      // Billboard component (always look at camera)
      AFRAME.registerComponent('billboard', {
          tick: function () {
              this.el.object3D.lookAt(this.el.sceneEl.camera.el.object3D.position);
          }
      });

      // Model Controller Component (Pinch Scale + Rotation)
      AFRAME.registerComponent('model-controller', {
        schema: {
          minScale: { default: 0.1 },
          maxScale: { default: 10.0 },
          rotationSpeed: { default: 2.0 } // Reduced sensitivity
        },
        init: function () {
          this.initialScale = this.el.object3D.scale.clone();
          this.isScaling = false;
          this.isRotating = false;
          this.startDistance = 0;
          this.startX = 0;
          
          // Bind methods
          this.onTouchStart = this.onTouchStart.bind(this);
          this.onTouchMove = this.onTouchMove.bind(this);
          this.onTouchEnd = this.onTouchEnd.bind(this);
          
          // Add event listeners to scene (global input)
          this.sceneEl = this.el.sceneEl;
          this.sceneEl.canvas.addEventListener('touchstart', this.onTouchStart);
          this.sceneEl.canvas.addEventListener('touchmove', this.onTouchMove);
          this.sceneEl.canvas.addEventListener('touchend', this.onTouchEnd);
          
          // Mouse support for desktop testing
          this.onMouseDown = this.onMouseDown.bind(this);
          this.onMouseMove = this.onMouseMove.bind(this);
          this.onMouseUp = this.onMouseUp.bind(this);
          
          this.sceneEl.canvas.addEventListener('mousedown', this.onMouseDown);
          this.sceneEl.canvas.addEventListener('mousemove', this.onMouseMove);
          this.sceneEl.canvas.addEventListener('mouseup', this.onMouseUp);
        },
        
        remove: function() {
           // Cleanup
           this.sceneEl.canvas.removeEventListener('touchstart', this.onTouchStart);
           this.sceneEl.canvas.removeEventListener('touchmove', this.onTouchMove);
           this.sceneEl.canvas.removeEventListener('touchend', this.onTouchEnd);
           this.sceneEl.canvas.removeEventListener('mousedown', this.onMouseDown);
           this.sceneEl.canvas.removeEventListener('mousemove', this.onMouseMove);
           this.sceneEl.canvas.removeEventListener('mouseup', this.onMouseUp);
        },

        onTouchStart: function (evt) {
          if (evt.touches.length === 2) {
            this.isScaling = true;
            this.startDistance = this.getDistance(evt.touches);
          } else if (evt.touches.length === 1) {
            // Only rotate if we are NOT interacting with UI
            if (evt.target.closest('.ui-element')) return;
            
            this.isRotating = true;
            this.startX = evt.touches[0].clientX;
          }
        },

        onTouchMove: function (evt) {
          if (!this.el.getAttribute('visible')) return;

          if (this.isScaling && evt.touches.length === 2) {
            // Zoom Logic (Pinch)
            const currentDistance = this.getDistance(evt.touches);
            const scaleFactor = currentDistance / this.startDistance;
            
            // Linear Zoom 1:1
            const newScale = this.initialScale.x * scaleFactor;

            if (newScale >= this.data.minScale && newScale <= this.data.maxScale) {
                this.el.object3D.scale.set(newScale, newScale, newScale);
            }
          } else if (this.isRotating && evt.touches.length === 1) {
             // Rotation Logic (1 Finger)
             const currentX = evt.touches[0].clientX;
             const deltaX = currentX - this.startX;
             
             // Normalize by screen width for consistency
             const screenWidth = window.innerWidth;
             const rotationAmount = (deltaX / screenWidth) * Math.PI * 2 * this.data.rotationSpeed;
             
             this.el.object3D.rotation.y += rotationAmount;
             
             this.startX = currentX;
          }
        },

        onTouchEnd: function (evt) {
          if (evt.touches.length < 2) {
            this.isScaling = false;
            // Reset initial scale reference for next pinch
            this.initialScale = this.el.object3D.scale.clone();
          }
          if (evt.touches.length === 0) {
             this.isRotating = false;
          }
        },
        
        // Mouse handlers for desktop
        onMouseDown: function(evt) {
             if (evt.target.closest('.ui-element')) return;
             this.isRotating = true;
             this.startX = evt.clientX;
        },
        
        onMouseMove: function(evt) {
             if (!this.el.getAttribute('visible')) return;
             if(this.isRotating) {
                 const currentX = evt.clientX;
                 const deltaX = currentX - this.startX;
                 const screenWidth = window.innerWidth;
                 const rotationAmount = (deltaX / screenWidth) * Math.PI * 2 * this.data.rotationSpeed;
                 this.el.object3D.rotation.y += rotationAmount;
                 this.startX = currentX;
             }
        },
        
        onMouseUp: function() {
             this.isRotating = false;
        },

        getDistance: function (touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        }
      });
      </script>

    <script>
      // Handler for marker detection
      // Removed redundant markerhandler component as logic is handled by scripts below
      /*
      AFRAME.registerComponent('markerhandler', {
        init: function () {
          this.el.addEventListener('markerFound', () => {
             const markerId = this.el.id.split('-')[1];
             console.log('Marker Found:', markerId);
             activeMarkerId = markerId;
             updateInfoPanel();
          });
          this.el.addEventListener('markerLost', () => {
             // Optional: Hide info panel if we want strict AR
             // infoPanel.classList.remove('visible');
          });
        }
      });
      */

      // Global click handler for better touch response
      AFRAME.registerComponent('cursor-listener', {
        init: function () {
          this.el.addEventListener('click', function (evt) {
            // This is a backup listener in case the individual ones fail
            // It just logs for now
             console.log('Global click on', evt.detail.intersection.object.el.id);
          });
          
          // Also listen for mousedown/touchstart
          this.el.addEventListener('mousedown', function (evt) {
             console.log('Global mousedown on', evt.detail.intersection.object.el.id);
          });
        }
      });
      
      const debugText = document.getElementById('debug-text');
      const captureBtn = document.getElementById('capture-btn');
      const infoPanel = document.getElementById('info-panel');
      const panelTitle = document.getElementById('panel-title');
      const panelDesc = document.getElementById('panel-desc');
      const panelPrice = document.getElementById('panel-price');
      const flashOverlay = document.getElementById('flash-overlay');

      let activeMarkerId = null;
      const visibleMarkers = new Set(); // Track which markers are currently detected

      // Dish Data
      const dishes = {
        0: {
          name: "Zelva Ramen",
          desc: "Ramen de la casa, ideal para el frío y para experiencias AR inmersivas.",
          price: "S/ 32.00"
        },
        1: {
          name: "Volcano Roll",
          desc: "Delicioso rollo con salsa volcánica y relleno especial.",
          price: "S/ 25.00"
        },
        2: {
          name: "Nigiris Especiales",
          desc: "Selección de nigiris con salmón fresco y toques cítricos.",
          price: "S/ 15.00"
        },
        3: {
          name: "Makis New Styles",
          desc: "Makis New Styles de Zelva Nikkei (Amazon, Anticuchero, Banzai, Kaminaki, Parrillero, Pulpo al Olivo, Jalea).",
          price: "S/ 25.00"
        }
      };

      const scene = document.querySelector('a-scene');

      // Debug: Log all clicks on scene to see what's being hit
      scene.addEventListener('click', (evt) => {
        // Only log if not stopped
        console.log("Scene click", evt.target);
      });

      // Capture Button Logic
      captureBtn.addEventListener('click', () => {
        // Visual Feedback (Flash) - Trigger immediately
        flashOverlay.classList.add('flash-active');
        setTimeout(() => {
          flashOverlay.classList.remove('flash-active');
        }, 150);

        // 1. Setup Capture Canvas (Match Viewport)
        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = window.innerWidth;
        captureCanvas.height = window.innerHeight;
        const ctx = captureCanvas.getContext('2d');

        // 2. Draw Video (Camera Feed) - Correctly Scaled (Cover)
        const video = document.querySelector('video');
        if (video) {
          const vRatio = video.videoWidth / video.videoHeight;
          const cRatio = captureCanvas.width / captureCanvas.height;
          let sWidth, sHeight, sx, sy;

          // Object-fit: cover logic
          if (cRatio > vRatio) {
            sWidth = video.videoWidth;
            sHeight = video.videoWidth / cRatio;
            sx = 0;
            sy = (video.videoHeight - sHeight) / 2;
          } else {
            sWidth = video.videoHeight * cRatio;
            sHeight = video.videoHeight;
            sx = (video.videoWidth - sWidth) / 2;
            sy = 0;
          }
          
          ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, captureCanvas.width, captureCanvas.height);
        }

        // 3. Draw WebGL Scene (Models)
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.canvas) {
          // FORCE RENDER to ensure model is in buffer
          sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
          
          const glCanvas = sceneEl.canvas;
          ctx.drawImage(glCanvas, 0, 0, captureCanvas.width, captureCanvas.height);
        }

        // 5. Download
        const link = document.createElement('a');
        link.download = `web-ar-capture-${Date.now()}.png`;
        link.href = captureCanvas.toDataURL('image/png');
        link.click();
      });

      // Component to enforce single model visibility every frame (Nuclear Option)
      AFRAME.registerComponent('enforce-exclusivity', {
        tick: function() {
          // If no marker is active yet, hide all
          if (activeMarkerId === null) {
             [0, 1, 2, 3].forEach(id => {
                 const model = document.getElementById('model-' + id);
                 const placeholder = document.getElementById('placeholder-' + id);
                 if (model) {
                     model.setAttribute('visible', false);
                     if(model.object3D) model.object3D.visible = false;
                 }
                 if (placeholder) {
                     // Optionally show placeholders initially if marker is found? 
                     // No, let them be hidden until tracking starts.
                     placeholder.setAttribute('visible', true); 
                     if(placeholder.object3D) placeholder.object3D.visible = true;
                 }
             });
             return;
          }

          // If we have an active marker, ensure ONLY that one shows MODEL
          // The others show PLACEHOLDER
          [0, 1, 2, 3].forEach(id => {
             const model = document.getElementById('model-' + id);
             const placeholder = document.getElementById('placeholder-' + id);
             
             const isModelActive = (id == activeMarkerId);
             
             if (model) {
                 if (model.getAttribute('visible') !== isModelActive) {
                     model.setAttribute('visible', isModelActive);
                     if(model.object3D) model.object3D.visible = isModelActive;
                 }
                 if(model.object3D && model.object3D.visible !== isModelActive) {
                    model.object3D.visible = isModelActive;
                 }
             }
             
             if (placeholder) {
                 const isPlaceholderActive = !isModelActive;
                 if (placeholder.getAttribute('visible') !== isPlaceholderActive) {
                     placeholder.setAttribute('visible', isPlaceholderActive);
                     if(placeholder.object3D) placeholder.object3D.visible = isPlaceholderActive;
                 }
                 if(placeholder.object3D && placeholder.object3D.visible !== isPlaceholderActive) {
                    placeholder.object3D.visible = isPlaceholderActive;
                 }
             }
          });
        }
      });

      // Component to make entities face the camera (Billboard)
      AFRAME.registerComponent('billboard', {
        tick: function() {
          const camera = this.el.sceneEl.camera;
          if (!camera) return;
          this.el.object3D.lookAt(camera.el.object3D.position);
        }
      });

      // Component to handle clicks on specific entities (Raycaster)
      AFRAME.registerComponent('click-handler', {
        init: function () {
          this.el.addEventListener('click', (evt) => {
             const marker = this.el.closest('a-marker');
             if (marker) {
                 const id = parseInt(marker.id.split('-')[1]);
                 console.log("Raycaster clicked marker:", id);
                 
                 // Visual feedback for the click
                 const debugEl = document.getElementById('debug-text');
                 if (debugEl) debugEl.innerHTML = `CLICKED: M${id}`;
                 
                 // Animation Feedback on the Ring
                 const ring = marker.querySelector('a-ring');
                 if (ring) {
                     ring.setAttribute('animation__click', 'property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dur: 150; easing: easeInOutQuad; dir: alternate; loop: 2');
                     setTimeout(() => {
                         ring.removeAttribute('animation__click');
                     }, 400);
                 }

                 if (activeMarkerId !== id) {
                    activeMarkerId = id;
                    updateState();
                 }
             }
          });
          
          // Also listen for touchstart directly on the entity for faster response
          this.el.addEventListener('touchstart', (evt) => {
             const marker = this.el.closest('a-marker');
             if (marker) {
                 const id = parseInt(marker.id.split('-')[1]);
                 console.log("Raycaster touchstart marker:", id);
                 
                 // Visual feedback for the click
                 const ring = marker.querySelector('a-ring');
                 if (ring) {
                     ring.setAttribute('animation__click', 'property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dur: 150; easing: easeInOutQuad; dir: alternate; loop: 2');
                     setTimeout(() => {
                         ring.removeAttribute('animation__click');
                     }, 400);
                 }
                 
                 if (activeMarkerId !== id) {
                    activeMarkerId = id;
                    updateState();
                 }
             }
          });
        }
      });

      // Update Info Panel based on activeMarkerId
      function updateState() {
        // Models are handled by 'enforce-exclusivity' component now
        // Just update the info panel
        if (activeMarkerId !== null && dishes[activeMarkerId]) {
          const dish = dishes[activeMarkerId];
          panelTitle.innerText = dish.name;
          panelDesc.innerText = dish.desc;
          panelPrice.innerText = dish.price;
          infoPanel.classList.add('visible');
        } else {
          infoPanel.classList.remove('visible');
        }
      }

      // Add simple keyframe animation for the tap feedback
      const style = document.createElement('style');
      style.innerHTML = `
        @keyframes ping {
          0% { transform: scale(0.5); opacity: 1; }
          100% { transform: scale(2); opacity: 0; }
        }
      `;
      document.head.appendChild(style);

      // ---------------------------------------------------------
      // Screen-Space Interaction Logic (Tap to Select)
      // ---------------------------------------------------------
      
      // Project 3D position to 2D screen coordinates
      function toScreenPosition(object3D, camera) {
          const vector = new THREE.Vector3();
          // Get world position
          object3D.getWorldPosition(vector);
          
          // Project to normalized device coordinates (-1 to +1)
          vector.project(camera);
          
          // Map to screen coordinates
          const widthHalf = window.innerWidth / 2;
          const heightHalf = window.innerHeight / 2;
          
          return {
              x: (vector.x * widthHalf) + widthHalf,
              y: -(vector.y * heightHalf) + heightHalf
          };
      }

      // 3. Check for Tap Selection (Priority 1)
      function checkMarkerTap(x, y) {
          const debugEl = document.getElementById('debug-text');
          let closestDist = Infinity;
          let closestId = null;
          
          let debugMsg = `Tap: ${x.toFixed(0)},${y.toFixed(0)}<br>`;

          // IMPORTANT: Check ALL markers, not just visible ones?
          // If markerLost fired, it's removed from visibleMarkers.
          // BUT, sometimes AR.js loses tracking for a split second.
          // Let's check ALL markers if visibleMarkers is empty, just in case?
          // No, if not tracked, matrixWorld is invalid.
          
          if (visibleMarkers.size === 0) {
             debugMsg += "No markers tracked";
             if(debugEl) debugEl.innerHTML = debugMsg;
             return false;
          }

          // Convert Set to Array to avoid issues
          Array.from(visibleMarkers).forEach(id => {
              const marker = document.getElementById('marker-' + id);
              if (!marker) return;

              // Project marker position to screen coordinates
              const vector = new THREE.Vector3();
              const camera = scene.camera; 
              if (!camera) return;

              // Make sure matrixWorld is updated
              if (marker.object3D) {
                  vector.setFromMatrixPosition(marker.object3D.matrixWorld);
                  vector.project(camera);
                  
                  const screenX = (vector.x * .5 + .5) * window.innerWidth;
                  const screenY = -(vector.y * .5 - .5) * window.innerHeight;
                  
                  const dx = x - screenX;
                  const dy = y - screenY;
                  const dist = Math.sqrt(dx*dx + dy*dy);
                  
                  debugMsg += `M${id}: ${dist.toFixed(0)}px<br>`;
    
                  // Threshold: Half of the screen size (very generous)
                  const limit = Math.min(window.innerWidth, window.innerHeight) * 0.5;
                  
                  if (dist < limit && dist < closestDist) {
                      closestDist = dist;
                      closestId = id;
                  }
              }
          });
          
          debugMsg += `Select: ${closestId}`;
          if(debugEl) debugEl.innerHTML = debugMsg;

          if (closestId !== null && closestId !== activeMarkerId) {
              console.log("Tap detected on marker:", closestId);
              activeMarkerId = closestId;
              updateState();
              return true; // Handled
          }
          return false;
      }

      // Global Tap Handler
      // We use 'touchend' to detect taps, but check if it was a drag
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;

      window.addEventListener('touchstart', (evt) => {
          if(evt.touches.length === 1) {
              touchStartX = evt.touches[0].clientX;
              touchStartY = evt.touches[0].clientY;
              touchStartTime = Date.now();
          }
      }, {passive: false});

      window.addEventListener('touchend', (evt) => {
          if (evt.changedTouches.length === 0) return;
          
          const touchEndX = evt.changedTouches[0].clientX;
          const touchEndY = evt.changedTouches[0].clientY;
          const timeDiff = Date.now() - touchStartTime;
          const distDiff = Math.sqrt(Math.pow(touchEndX - touchStartX, 2) + Math.pow(touchEndY - touchStartY, 2));

          // If tap is short (<500ms) and didn't move much (<50px)
          if (timeDiff < 500 && distDiff < 50) {
              // It's a TAP!
              // Don't trigger if tapping UI
              if (evt.target.closest('.ui-element')) return;
              
              // Show tap feedback
              showTapFeedback(touchEndX, touchEndY);

              // Pass the touch coordinates to checkMarkerTap
              checkMarkerTap(touchEndX, touchEndY);
          }
      });
      
      function showTapFeedback(x, y) {
          const el = document.createElement('div');
          el.style.position = 'absolute';
          el.style.left = (x - 20) + 'px';
          el.style.top = (y - 20) + 'px';
          el.style.width = '40px';
          el.style.height = '40px';
          el.style.border = '2px solid white';
          el.style.borderRadius = '50%';
          el.style.pointerEvents = 'none';
          el.style.zIndex = '9999';
          el.style.animation = 'ping 0.5s ease-out forwards';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 500);
      }
      
      // Also support mouse click for testing
      window.addEventListener('click', (evt) => {
          if (evt.target.closest('.ui-element')) return;
          showTapFeedback(evt.clientX, evt.clientY);
          checkMarkerTap(evt.clientX, evt.clientY);
      });
      
      // ---------------------------------------------------------

      // Handle marker detection
      const lostTimeouts = {}; // Store timeouts for debounce

      [0, 1, 2, 3].forEach(id => {
        const marker = document.getElementById('marker-' + id);
        if (!marker) return;
        
        marker.addEventListener('markerFound', () => {
          // Clear any pending lost event for this marker
          if (lostTimeouts[id]) {
            clearTimeout(lostTimeouts[id]);
            delete lostTimeouts[id];
          }
          
          visibleMarkers.add(id);
          
          // Auto-select if nothing is selected (First one wins)
          if (activeMarkerId === null) {
              activeMarkerId = id;
          }
          
          updateState();
        });

        marker.addEventListener('markerLost', () => {
          // Debounce: Wait 500ms before actually declaring it lost
          lostTimeouts[id] = setTimeout(() => {
            visibleMarkers.delete(id);
            
            // If the active marker is lost, check if there are others visible
            if (activeMarkerId == id) {
                if (visibleMarkers.size > 0) {
                    // Switch to the first available marker
                    const nextId = visibleMarkers.values().next().value;
                    activeMarkerId = nextId;
                } else {
                    activeMarkerId = null; 
                }
            }
            
            updateState();
            delete lostTimeouts[id];
          }, 500);
        });
      });
    </script>
  </body>
