<!DOCTYPE html>
<html>
  <head>
    <title>WebAR - Escáner de Códigos de Barras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js for Barcode/Marker Tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      /* Force video to fill screen on mobile */
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      /* Fix for AR.js video size on mobile */
      video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        z-index: -1 !important;
        margin: 0 !important;
      }
      
      .ui-overlay {
        position: fixed;
        top: 20px;
        left: 0;
        width: 100%;
        text-align: center;
        color: white;
        z-index: 100;
        pointer-events: none;
        text-shadow: 2px 2px 4px black;
      }
      .marker-guide {
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 20px;
        display: inline-block;
      }
      .debug-info {
        position: fixed;
        bottom: 10px;
        left: 10px;
        color: lime;
        font-family: monospace;
        z-index: 100;
        background: rgba(0,0,0,0.5);
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="ui-overlay">
      <div class="marker-guide">
        <h3>📷 MODO CÓDIGO DE BARRAS</h3>
        <p>Apunta a los códigos cuadrados (0, 1, 2, 3)</p>
      </div>
    </div>
    
    <div class="debug-info" id="debug-text">Esperando cámara...</div>

    <!-- AR.js Scene Setup for 3x3 Barcodes -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; canvasWidth: 1920; canvasHeight: 1080;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      vr-mode-ui="enabled: false">

      <a-assets>
        <a-asset-item id="ramen-model" src="models/sushi/shrimp_ramen_bowl.glb"></a-asset-item>
        <a-asset-item id="roll-model" src="models/sushi/sushi_rolls.glb?v=2"></a-asset-item>
        <a-asset-item id="salmon-model" src="models/sushi/salmon_nigiri.glb"></a-asset-item>
        <a-asset-item id="sushi-model" src="models/sushi/sushi.glb"></a-asset-item>
      </a-assets>

      <!-- MARKER 0: RAMEN -->
      <a-marker type="barcode" value="0" id="marker-0">
        <a-entity 
          gltf-model="#ramen-model" 
          scale="0.4 0.4 0.4" 
          rotation="0 0 0"
          position="0 0 0">
        </a-entity>
        <a-text value="Zelva Ramen" position="0 0.8 0" align="center" color="#FFF" scale="2 2 2"></a-text>
      </a-marker>

      <!-- MARKER 1: SUSHI ROLL -->
      <a-marker type="barcode" value="1" id="marker-1">
        <a-entity 
          gltf-model="#roll-model" 
          scale="0.4 0.4 0.4" 
          rotation="0 0 0"
          position="0 0 0">
        </a-entity>
        <a-text value="Volcano Roll" position="0 0.8 0" align="center" color="#FFF" scale="2 2 2"></a-text>
      </a-marker>

      <!-- MARKER 2: SALMON -->
      <a-marker type="barcode" value="2" id="marker-2">
        <a-entity 
          gltf-model="#salmon-model" 
          scale="0.4 0.4 0.4" 
          rotation="0 0 0"
          position="0 0 0">
        </a-entity>
        <a-text value="Nigiris" position="0 0.8 0" align="center" color="#FFF" scale="2 2 2"></a-text>
      </a-marker>

      <!-- MARKER 3: SUSHI MAIN -->
      <a-marker type="barcode" value="3" id="marker-3">
        <a-entity 
          gltf-model="#sushi-model" 
          scale="0.4 0.4 0.4" 
          rotation="0 0 0"
          position="0 0 0">
        </a-entity>
        <a-text value="Makis" position="0 0.8 0" align="center" color="#FFF" scale="2 2 2"></a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Simple debug script
      const debugText = document.getElementById('debug-text');
      const scene = document.querySelector('a-scene');

      scene.addEventListener('loaded', () => {
        debugText.innerText = "Cámara lista. Apunta a un código.";
      });

      scene.addEventListener('camera-error', (e) => {
        debugText.innerText = "Error de cámara: " + e.detail;
        debugText.style.color = "red";
      });

      // Marker listeners
      [0, 1, 2, 3].forEach(id => {
        const marker = document.getElementById('marker-' + id);
        marker.addEventListener('markerFound', () => {
          debugText.innerText = `¡Código ${id} DETECTADO!`;
          debugText.style.color = "#00FF00";
        });
        marker.addEventListener('markerLost', () => {
          debugText.innerText = "Buscando códigos...";
          debugText.style.color = "lime";
        });
      });
    </script>
  </body>
</html>
