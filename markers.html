<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Targets WebAR</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
            margin-bottom: 40px;
            width: 90%;
            max-width: 500px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        input[type=range] {
            flex-grow: 1;
            cursor: pointer;
        }
        #size-label {
            font-weight: bold;
            color: #2980b9;
            min-width: 60px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .marker-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .marker-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .marker-card h3 {
            margin-top: 0;
            color: #34495e;
        }
        .marker-img-container {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        img { width: 200px; height: 200px; object-fit: contain; background: #fff; transition: width 0.2s, height 0.2s; }
        .btn { 
            display: inline-block;
            padding: 15px 40px; 
            background: #27ae60; 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            margin-top: 40px; 
            font-size: 1.2em; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }
        .error-help { 
            color: #e74c3c; 
            font-size: 0.9em; 
            margin-top: 10px; 
            display: none; 
        }
        
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="config.js"></script>
</head>
<body>
    <h1>Targets AR (Imágenes)</h1>
    <p>Abre <b>index.html</b> y apunta a estas imágenes para ver los modelos.</p>
    
    <div class="controls">
        <label for="size-slider" style="display:block; margin-bottom:10px; font-weight:bold;">Ajustar Tamaño:</label>
        <div class="slider-container">
            <span style="font-size: 0.8em;">Pequeño</span>
            <input type="range" id="size-slider" min="100" max="500" value="200" oninput="updateSize(this.value)">
            <span style="font-size: 0.8em;">Grande</span>
            <span id="size-label">200px</span>
        </div>
    </div>

    <div class="grid-container" id="grid"></div>
    
    <a href="index.html" class="btn">¡Abrir Escáner AR!</a>
    <br><br><br>

    <script>
        const LOCAL_DB_NAME = 'webar_local_assets';
        const cache = new Map();

        function updateSize(val) {
            const images = document.querySelectorAll('img');
            const sizeLabel = document.getElementById('size-label');
            sizeLabel.innerText = val + 'px';
            images.forEach(img => {
                img.style.width = val + 'px';
                img.style.height = val + 'px';
            });
        }

        function openLocalDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(LOCAL_DB_NAME, 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains('blobs')) {
                        db.createObjectStore('blobs', { keyPath: 'key' });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function getLocalBlob(key) {
            const db = await openLocalDb();
            return await new Promise((resolve, reject) => {
                const tx = db.transaction('blobs', 'readonly');
                const store = tx.objectStore('blobs');
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                req.onerror = () => reject(req.error);
            });
        }

        async function resolveSrc(pathOrUrl) {
            if (!pathOrUrl || typeof pathOrUrl !== 'string') return null;
            if (pathOrUrl.startsWith('idb://')) {
                const key = pathOrUrl.replace(/^idb:\/\//, '');
                if (cache.has(key)) return cache.get(key);
                const blob = await getLocalBlob(key);
                if (!blob) return null;
                const url = URL.createObjectURL(blob);
                cache.set(key, url);
                return url;
            }
            if (/^https?:\/\//i.test(pathOrUrl)) return pathOrUrl;
            if (pathOrUrl.startsWith('/') && typeof CONFIG !== 'undefined' && CONFIG && typeof CONFIG.getApiBaseUrl === 'function') {
                const base = CONFIG.getApiBaseUrl();
                if (base) return `${base}${pathOrUrl}`;
            }
            if (typeof CONFIG !== 'undefined' && CONFIG && typeof CONFIG.getRawUrl === 'function') return CONFIG.getRawUrl(pathOrUrl.replace(/^\/+/, ''));
            return pathOrUrl;
        }

        async function loadCatalog() {
            const localOverride = localStorage.getItem('ar_catalog_data');
            if (localOverride) {
                try { return JSON.parse(localOverride); } catch (e) {}
            }

            const apiBase = (typeof CONFIG !== 'undefined' && CONFIG && typeof CONFIG.getApiBaseUrl === 'function') ? CONFIG.getApiBaseUrl() : '';
            if (apiBase) {
                const r = await fetch(`${apiBase}/api/catalog`, { cache: 'no-store' });
                if (r.ok) return await r.json();
            }

            try {
                const r = await fetch('/api/catalog', { cache: 'no-store' });
                if (r.ok) return await r.json();
            } catch (e) {}

            try {
                const r = await fetch('catalog/catalog.json', { cache: 'no-store' });
                if (r.ok) return await r.json();
            } catch (e) {}

            return [];
        }

        async function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const items = (await loadCatalog()).filter((i) => i && i.marker);
            items.sort((a, b) => (Number.isFinite(a.targetIndex) ? a.targetIndex : 99999) - (Number.isFinite(b.targetIndex) ? b.targetIndex : 99999));

            for (const item of items) {
                const card = document.createElement('div');
                card.className = 'marker-card';
                const title = document.createElement('h3');
                const idx = Number.isFinite(item.targetIndex) ? item.targetIndex : '-';
                title.textContent = `${idx}: ${item.name || item.id || 'Target'}`;
                const container = document.createElement('div');
                container.className = 'marker-img-container';
                const img = document.createElement('img');
                img.alt = String(item.name || item.id || 'Target');
                const src = await resolveSrc(item.marker);
                if (src) img.src = src;
                container.appendChild(img);
                card.appendChild(title);
                card.appendChild(container);
                grid.appendChild(card);
            }
        }

        render();
    </script>
</body>

</html>
